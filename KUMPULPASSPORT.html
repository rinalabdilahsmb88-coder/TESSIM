<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 RoboPass · Staff Check-in System</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ───────── RESET & BASE ───────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e17;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #e8f0fe;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(0, 180, 255, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(150, 0, 255, 0.05) 0%, transparent 60%),
                repeating-linear-gradient(0deg, transparent, transparent 99px, rgba(0, 180, 255, 0.02) 99px, rgba(0, 180, 255, 0.02) 100px);
        }

        /* ───────── SCROLLBAR ───────── */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e17;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00d4ff, #7b2ffc);
            border-radius: 10px;
        }

        /* ───────── CONTAINER ───────── */
        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ───────── HEADER / ROBOTIC BRAND ───────── */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            margin-bottom: 32px;
            background: rgba(10, 14, 23, 0.75);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 180, 255, 0.20);
            border-radius: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), inset 0 0 60px rgba(0, 180, 255, 0.03);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(0, 180, 255, 0.03), transparent 60%);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }
        .brand .robot-icon {
            font-size: 2.6rem;
            filter: drop-shadow(0 0 20px rgba(0, 180, 255, 0.5));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .brand h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.9rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00d4ff, #a855f7, #00d4ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .brand .badge {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 4px 14px;
            border-radius: 40px;
            background: rgba(0, 180, 255, 0.15);
            border: 1px solid rgba(0, 180, 255, 0.25);
            color: #00d4ff;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 1;
            flex-wrap: wrap;
        }
        .header-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .header-stats .stat-item i {
            color: #00d4ff;
            font-size: 1.1rem;
        }
        .header-stats .stat-item strong {
            color: #e8f0fe;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .status-led {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.20);
        }
        .status-led .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 20px #00ff88;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        .status-led span {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #00ff88;
        }

        /* ───────── SEARCH & FILTER ───────── */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            align-items: center;
            justify-content: space-between;
        }
        .search-wrapper {
            flex: 1;
            min-width: 240px;
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #475569;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .search-wrapper input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            color: #e8f0fe;
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .search-wrapper input::placeholder {
            color: #475569;
            font-weight: 300;
        }
        .search-wrapper input:focus {
            border-color: rgba(0, 180, 255, 0.5);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.06);
        }
        .search-wrapper input:focus+i {
            color: #00d4ff;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-group .filter-btn {
            padding: 10px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-group .filter-btn i {
            font-size: 0.9rem;
        }
        .filter-group .filter-btn:hover {
            background: rgba(0, 180, 255, 0.08);
            border-color: rgba(0, 180, 255, 0.20);
            color: #e8f0fe;
        }
        .filter-group .filter-btn.active {
            background: rgba(0, 180, 255, 0.12);
            border-color: rgba(0, 180, 255, 0.35);
            color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.04);
        }

        /* ───────── STAFF GRID ───────── */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* ───────── CARD — ROBOTIC PASSPORT ───────── */
        .passport-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 24px 22px 22px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: default;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }
        .passport-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.15), rgba(168, 85, 247, 0.08), rgba(0, 180, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .passport-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(0, 180, 255, 0.20);
            box-shadow: 0 12px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 180, 255, 0.04);
            background: rgba(255, 255, 255, 0.06);
        }
        .passport-card:hover::before {
            background: linear-gradient(135deg, rgba(0, 180, 255, 0.35), rgba(168, 85, 247, 0.20), rgba(0, 180, 255, 0.10));
        }

        /* Holographic shimmer overlay */
        .passport-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 180, 255, 0.02), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
        }
        .passport-card:hover::after {
            opacity: 1;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .card-id {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #64748b;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #00ff88;
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
            background: rgba(0, 255, 136, 0.06);
            border: 1px solid rgba(0, 255, 136, 0.10);
        }
        .card-status .mini-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 12px #00ff88;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        .card-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e8f0fe;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-name .id-badge {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
        }

        .card-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 180, 255, 0.15), transparent);
            margin: 14px 0 16px;
            position: relative;
            z-index: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-footer .checkin-time {
            font-size: 0.75rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-footer .checkin-time i {
            color: #00d4ff;
            font-size: 0.8rem;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }
        .card-actions .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .card-actions .action-btn:hover {
            background: rgba(0, 180, 255, 0.10);
            color: #00d4ff;
            border-color: rgba(0, 180, 255, 0.15);
            transform: scale(1.1);
        }
        .card-actions .action-btn.checkin-btn {
            background: rgba(0, 255, 136, 0.06);
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.08);
            width: auto;
            padding: 0 18px;
            border-radius: 40px;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Inter', sans-serif;
        }
        .card-actions .action-btn.checkin-btn:hover {
            background: rgba(0, 255, 136, 0.12);
            border-color: rgba(0, 255, 136, 0.20);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.06);
        }

        /* ───────── ROBOTIC SCAN LINE (hover effect) ───────── */
        .passport-card .scan-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, #a855f7, #00d4ff, transparent);
            background-size: 200% 100%;
            animation: scanMove 3s linear infinite;
            opacity: 0;
            transition: opacity 0.6s;
            border-radius: 0 0 24px 24px;
        }
        .passport-card:hover .scan-line {
            opacity: 1;
        }
        @keyframes scanMove {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        /* ───────── TOAST NOTIFICATION ───────── */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 16px 22px;
            border-radius: 16px;
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 180, 255, 0.15);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideUp 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            transform-origin: bottom right;
        }
        .toast.hide {
            animation: slideDown 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes slideDown {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
        }
        .toast .toast-icon {
            font-size: 1.4rem;
            color: #00ff88;
        }
        .toast .toast-content {
            flex: 1;
        }
        .toast .toast-content strong {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #e8f0fe;
        }
        .toast .toast-content span {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* ───────── EMPTY STATE ───────── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state i {
            font-size: 3rem;
            color: #475569;
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-weight: 400;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* ───────── RESPONSIVE ───────── */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
                padding: 18px 20px;
            }
            .brand h1 {
                font-size: 1.4rem;
            }
            .header-stats {
                justify-content: space-between;
                gap: 12px;
            }
            .staff-grid {
                grid-template-columns: 1fr;
            }
            .filter-group {
                width: 100%;
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 4px;
            }
            .filter-group .filter-btn {
                flex-shrink: 0;
                padding: 8px 16px;
                font-size: 0.7rem;
            }
            .search-wrapper {
                min-width: 100%;
            }
            .card-name {
                font-size: 1.1rem;
            }
            .toast-container {
                right: 16px;
                left: 16px;
                max-width: 100%;
                bottom: 16px;
            }
        }

        @media (max-width: 480px) {
            .header-stats .stat-item {
                font-size: 0.75rem;
            }
            .brand .robot-icon {
                font-size: 2rem;
            }
            .brand .badge {
                font-size: 0.55rem;
                padding: 2px 10px;
            }
            .passport-card {
                padding: 18px 16px 18px;
            }
        }
    </style>
</head>

            { name: "BAMBANG AGUNG SUTRISNO", id: "E7520815" },

            { name: "RIVLAN RIZKY", id: "E6759553" },
            { name: "AHMAD ANDIKA", id: "E7631720" },
            { name: "ANGGARA K S", id: "E7647305" },
            { name: "EGA PRAYUDA", id: "E2703456" },
            { name: "ARJUN PRAISYA", id: "E7879939" },
            { name: "ADITYA PANCA", id: "X3189356" },
            { name: "AUDIS OYONG DUANSYAH", id: "E7281571" },
            { name: "ADE OJI SHAPUTRA", id: "E8491965" },
            { name: "ANDY PUTRA", id: "X3618101" },
            { name: "ALFIANSYAH", id: "E9268104" },
            { name: "MELAN PUTRI TRINITA", id: "E0441477" },
            { name: "GUNAWAN", id: "E8261752" },
            { name: "MAYA MARSELA", id: "E7892591" },
            { name: "HENGKI SANJAYA", id: "C7392958" },
            { name: "NAZLA YUSUF NASUTION", id: "X7654130" },
            { name: "SAKILA ANANDA SARI", id: "E1231228" },
            { name: "ADAM HANAFI", id: "E5803621" },
            { name: "RUBEN NATANAEL SITOMPUL", id: "X7111732" },
            { name: "DIMAS ADDRIYAN", id: "E8727741" },
            { name: "FEBRI IRAWAN", id: "X3215759" }
        ];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let staff = staffData.map((s, idx) => ({
            ...s,
            checked: false,
            checkinTime: null,
            index: idx,
        }));

        let currentFilter = 'all';
        let searchQuery = '';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const grid = document.getElementById('staffGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalCount = document.getElementById('totalCount');
        const checkedCount = document.getElementById('checkedCount');
        const toastContainer = document.getElementById('toastContainer');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function render() {
            const filtered = staff.filter(s => {
                const matchSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    s.id.toLowerCase().includes(searchQuery.toLowerCase());
                const matchFilter =
                    currentFilter === 'all' ? true :
                    currentFilter === 'checked' ? s.checked :
                    currentFilter === 'unchecked' ? !s.checked : true;
                return matchSearch && matchFilter;
            });

            // Update stats
            totalCount.textContent = staff.length;
            checkedCount.textContent = staff.filter(s => s.checked).length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-robot"></i>
                        <h3>Tidak ada staff ditemukan 🤖</h3>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(s => {
                const timeStr = s.checkinTime ?
                    new Date(s.checkinTime).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit',
                        second: '2-digit' }) :
                    '—';
                return `
                    <div class="passport-card" data-id="${s.id}" data-index="${s.index}">
                        <div class="scan-line"></div>
                        <div class="card-top">
                            <span class="card-id"><i class="far fa-id-card" style="margin-right:6px;"></i>${s.id}</span>
                            <span class="card-status">
                                <span class="mini-dot"></span>
                                ${s.checked ? 'CHECK-IN' : 'PENDING'}
                            </span>
                        </div>
                        <div class="card-name">
                            ${s.name}
                            <span class="id-badge">${s.id.slice(0,1)}-${s.id.slice(-4)}</span>
                        </div>
                        <div class="card-divider"></div>
                        <div class="card-footer">
                            <span class="checkin-time">
                                <i class="fas ${s.checked ? 'fa-check-circle' : 'fa-clock'}" style="color:${s.checked ? '#00ff88' : '#64748b'};"></i>
                                ${s.checked ? `Check-in ${timeStr}` : 'Belum check-in'}
                            </span>
                            <div class="card-actions">
                                <button class="action-btn checkin-btn" data-action="checkin" data-id="${s.id}">
                                    <i class="fas fa-fingerprint"></i> ${s.checked ? 'Update' : 'Check-in'}
                                </button>
                                <button class="action-btn" data-action="reset" data-id="${s.id}" title="Reset status">
                                    <i class="fas fa-undo-alt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Re-bind event listeners untuk tombol di dalam card
            document.querySelectorAll('[data-action="checkin"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    handleCheckin(id);
                });
            });

            document.querySelectorAll('[data-action="reset"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    handleReset(id);
                });
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ACTIONS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function handleCheckin(id) {
            const s = staff.find(st => st.id === id);
            if (!s) return;
            s.checked = true;
            s.checkinTime = Date.now();
            render();
            showToast(`✅ ${s.name} · Check-in berhasil`, `ID: ${s.id} · ${new Date().toLocaleTimeString('id-ID')}`);
        }

        function handleReset(id) {
            const s = staff.find(st => st.id === id);
            if (!s) return;
            s.checked = false;
            s.checkinTime = null;
            render();
            showToast(`↻ ${s.name} · Status direset`, `ID: ${s.id} · Pending`);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // TOAST
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function showToast(title, sub) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <span class="toast-icon">🤖</span>
                <div class="toast-content">
                    <strong>${title}</strong>
                    <span>${sub}</span>
                </div>
            `;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 400);
            }, 3200);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // FILTER / SEARCH EVENTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            render();
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // KEYBOARD SHORTCUT: ESC untuk clear search
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchInput.value = '';
                searchQuery = '';
                render();
                searchInput.blur();
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        render();

        // Toast sambutan
        setTimeout(() => {
            showToast('🤖 RoboPass siap digunakan', `${staff.length} staff terdaftar · Sistem neural aktif`);
        }, 600);
    </script>

</body>
</html>
