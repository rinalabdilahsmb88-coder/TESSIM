      { id: 's32', category: 'OLAHRAGA TERTENTU', title: 'BALAP MOTOR', content: `32.1 Semua taruhan dinyatakan TIDAK BERLAKU dan akan dikembalikan, jika balapan terganggu atau tertunda, dan tidak dilanjutkan kembali dalam kurun waktu 72 jam dari jadwal yang semula telah ditentukan, kecuali taruhan telah ditentukan tanpa syarat.\n\n32.2 Semua taruhan yang ditempatkan pada non-starter setelah latihan balapan resmi dilakukan tidak akan dikembalikan.\n\n32.3 Hasil pada saat presentasi podium yang akan diperhitungkan.\n\n32.4 Taruhan pada ronde kualifikasi balap motor ditentukan berdasarkan posisi grid awal yang ditetapkan pada akhir sesi kualifikasi.\n\n32.5 Waktu penalti yang diberlakukan oleh pihak resmi perlombaan selama babak kualifikasi akan dihitung. Penurunan peringkat grid lainnya atau promosi setelah babak kualifikasi berakhir tidak akan dihitung.\n\n32.6 Berikut adalah taruhan-taruhan yang ditawarkan pada Balap Motor:\n(a) Taruhan Non Live: (i) Fastest Lap (A) Hasil resmi, seperti pada saat presentasi podium untuk balapan yang akan digunakan. (ii) Head to Head (A) Jika terdapat salah satu pembalap tidak ikut serta dalam perlombaan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (B) Jika kedua pembalap gagal dalam menyelesaikan balapan, dan tercatat pada jumlah putaran yang sama. Taruhan Head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (C) Semua taruhan head to head akan diselesaikan berdasarkan posisi terakhir yang didapatkan langsung dari perlombaan tersebut di mana terdiri dari peserta yang berhasil mencapai garis akhir. (iii) Number of Classified Finishers (A) Taruhan berhubungan dengan jumlah total dari mobil/sepeda motor yang tergolong sebagai yang berhasil mencapai garis akhir pada akhir balapan. (iv) Ganjil/Genap (A) Taruhan ganjil atau genap ditentukan oleh posisi akhir seorang pembalap. Misalnya, Pembalap A selesai dengan posisi pertama – Ganjil. Pembalap B selesai dengan posisi kedua – Genap. (B) Jika peserta tidak terdaftar diantara para pemenang karena didiskualifikasi atau kecelakaan dan tidak dapat menyelesaikan lomba, maka taruhan yang diterima sehubungan dengan peserta tersebut dinyatakan tidak berlaku dan akan dikembalikan. (v) Outright (vi) Top 3 Winner Driver/Rider (A) Taruhan berhubungan dengan peserta yang berada di posisi pertama, kedua dan ketiga pada podium. (vii) Total Cars – incomplete First Lap (A) Non-starter dalam balapan tidak akan dihitung. (viii) Winning Margin (A) Penyelesaian taruhan berdasarkan pada perbedaan waktu antara 2 pembalap yang ditentukan. (B) Handicap yang ditampilkan pada situs adalah berdasarkan waktu, terhitung dalam detik. Misalnya, "6.0" berarti handicap sebesar 6 detik telah diberikan untuk pembalap tersebut. Jika taruhan ditempatkan di atas atau di bawah 6.0, adanya perbedaan waktu yang dibawah 6 detik (Misalnya 5.99 atau 5.8 detik dan seterusnya akan dianggap di bawah 6 detik dan adanya perbedaan waktu diatas 6 detik (Misalnya 6.01 atau 6.2 detik) akan dianggap lebih dari 6 detik. Jika perbedaan waktu tepat 6 detik (yaitu 6.00 detik) maka dinyatakan seri dan semua taruhan akan dikembalikan.\n(b) Taruhan Berjalan ("Live"): (i) Head to Head (ii) Outright\n(c) Sistem Skoring: Tipe Skoring B berlaku` },
      { id: 's33', category: 'OLAHRAGA TERTENTU', title: 'MUAY THAI', content: `33.1 Tampilan warna Merah dan Biru pada nama dari masing-masing petarung hanya bertujuan sebagai referensi saja. Semua taruhan akan tetap berlaku meskipun adanya perubahan tampilan warna pada nama dari petarung. Dalam situasi ini, nama pertarung akan digunakan sebagai indikator untuk menentukan pemenang.\n\n33.2 Semua taruhan akan dinyatakan tidak berlaku jika satu atau kedua peserta ("petarung") didiskualifikasi oleh juri atau wasit baik sebelum ataupun di saat pertandingan ("event") sedang berlangsung. Semua taruhan juga akan dinyatakan tidak berlaku jika satu atau kedua petarung didiskualifikasi oleh juri atau wasit pada saat berakhirnya event namun sebelum pengumuman hasil.\n\n33.3 Suatu event dianggap telah dimulai pada saat bel tanda dimulainya ronde pertama dibunyikan. Semua taruhan akan dinyatakan tidak berlaku jika satu atau kedua petarung gagal untuk memulai event tersebut.\n\n33.4 Semua taruhan akan diselesaikan berdasarkan keputusan resmi yang diumumkan di arena pertandingan langsung setelah berakhirnya event. Perubahan keputusan yang terjadi setelahnya (jika ada) tidak akan diakui, untuk kepentingan perhitungan taruhan.\n\n33.5 Apabila terdapat ketidakcocokan antara nama petarung di versi Bahasa Thai dengan terjemahannya pada situs kami, maka yang berlaku adalah versi Bahasa Thai.\n\n33.6 Operator berhak untuk tidak menerima, menolak ataupun membatalkan tanpa pemberitahuan terlebih dahulu apabila terdapat taruhan yang mana ditemukan atau dicurigai oleh Operator bahwa hasil atau jalannya suatu event ada kemungkinan telah dicurangi, dimanipulasi atau "match fixing". Percobaan atau tindakan Pengguna Akhir dalam melakukan kecurangan, manipulasi atau "match fixing" dalam suatu event akan menyebabkan penutupan pada akun dan/atau pembatasan permanen dalam kepemilikan akun, tergantung pada kebijakan Operator.\n\n33.7 Apabila terdapat kesalahan pengejaan nama pada petarung, semua taruhan akan tetap berlaku kecuali secara jelas yang bersangkutan adalah petarung yang berbeda, maka Operator memiliki kebijakan mutlak untuk memutuskan apakah petarung tersebut sama atau berbeda.\n\n33.8 Semua taruhan akan berlaku jika nama dari satu atau kedua petarung diganti namun petarung tersebut adalah orang yang sama.\n\n33.9 Jika pada suatu event terdapat taruhan yang memiliki kesalahan (error) pada harga atau odds maka kesalahan tersebut harus dilaporkan kepada Operator dalam dua belas (12) jam sejak penerimaan taruhan. Kesalahan yang dilaporkan setelah dua belas (12) jam dari waktu penerimaan taruhan tidak akan dilayani.\n\n33.10 Berikut adalah taruhan-taruhan yang ditawarkan pada Muay Thai:\n(a) Taruhan Non Live: (i) Handicap Asia - Taruhan Handicap Asia adalah taruhan pada peserta mana yang akan menjadi pemenang dari event tersebut. Dimana jika event diumumkan berakhir seri, maka semua taruhan Handicap Asia akan dinyatakan tidak berlaku. (ii) Atas/Bawah - Taruhan Atas/Bawah adalah taruhan pada berapa jumlah ronde yang telah diselesaikan pada suatu event. Ronde yang sedang berlangsung pada saat event dinyatakan berakhir tidak termasuk dalam hitungan jumlah ronde. Oleh karena itu, jika suatu event berakhir / knockout di tengah ronde ke 5 maka jumlah ronde yang dianggap telah diselesaikan adalah empat (4). Jika keputusan pemenang diumumkan oleh juri setelah berakhirnya ronde ke-lima berdasarkan jumlah poin, maka jumlah ronde yang dianggap telah selesai adalah lima.\n(b) Taruhan Berjalan ("Live"): (i) Handicap Asia - Taruhan Handicap Asia adalah taruhan pada peserta mana yang akan menjadi pemenang dari event tersebut. Dimana jika event diumumkan berakhir seri, maka semua taruhan Handicap Asia akan dinyatakan tidak berlaku.\n\n33.11 Sistem skoring yang berlaku untuk taruhan Muay Thai adalah Tipe Skoring B.` },
      { id: 's34', category: 'OLAHRAGA TERTENTU', title: 'BILLIARD / SNOOKER', content: `34.1 Agar taruhan dinyatakan berlaku, kedua pemain harus memulai dan menyelesaikan pertandingan. Waktu istirahat pada frame/rack pertama adalah dianggap sebagai permulaan pertandingan.\n\n34.2 Dalam situasi di mana pertandingan telah dimulai namun tidak diselesaikan untuk alasan apapun, semua taruhan dinyatakan TIDAK BERLAKU.\n\n34.3 Berikut adalah taruhan-taruhan yang ditawarkan pada Billiard/Snooker:\n(a) Taruhan Non Live: (i) Handicap Asia (ii) Ganjil/Genap (iii) Outright (iv) Atas/Bawah\n(b) Taruhan Berjalan ("Live"): (i) Handicap Asia\n(c) Sistem Skoring: Tipe Skoring B berlaku` },
      { id: 's35', category: 'OLAHRAGA TERTENTU', title: 'DAYUNG', content: `35.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Dayung:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's36', category: 'OLAHRAGA TERTENTU', title: 'RUGBI', content: `36.1 Kecuali dinyatakan berbeda, semua taruhan Rugbi diselesaikan berdasarkan 80 menit waktu pertandingan (termasuk perpanjangan waktu yang diberikan oleh wasit) namun tidak termasuk Babak Tambahan.\n\n36.2 Jika suatu pertandingan dihentikan sebelum 80 menit waktu pertandingan, semua taruhan pada pertandingan tersebut akan dinyatakan TIDAK BERLAKU kecuali jika hasil dari pasaran tertentu telah dapat ditentukan.\n\n36.3 Jika suatu pertandingan telah ditunda atau dibatalkan, dan tidak dilanjutkan kembali dalam kurun waktu 24 jam dari waktu mulai yang dijadwalkan, semua taruhan akan dinyatakan Tidak Berlaku dan modal taruhan akan dikembalikan.\n\n36.4 Jika terjadi pergantian arena pertandingan maka taruhan akan tetap berlaku selama Tim Tuan Rumah masih ditetapkan menjadi tuan rumah. Jika posisi Tim Tuan Rumah dan Tamu dalam suatu pertandingan dicantumkan terbalik, maka taruhan akan dinyatakan Tidak Berlaku.\n\n36.5 Untuk Rugby Union (Rugby Sevens dan Rugby tens) dan Rugby League (Rugby League Nines), kecuali dinyatakan berbeda, semua pertandingan akan diselesaikan berdasarkan peraturan turnamen tertentu dan termasuk Babak Tambahan (jika ada).\n\n36.6 Berikut adalah jenis taruhan Tidak Langsung (Non Live) dan Taruhan Berjalan ("Live") yang ditawarkan pada Rugbi:\n(a) Taruhan pada Pertandingan, Tim dan Pemain: (i) Untuk Rugby Union – Taruhan Handicap / Alternatif / Taruhan Handicap Tambahan / Match and Team Totals / Alternative Totals (A) Dalam pasaran 2 arah berlaku peraturan Tidak Berlaku/Seri/Dikembalikan. (B) Dalam pasaran 3 arah yang tersedia pilihan seri, salah satu pilihan akan dihitung sebagai pemenang. (ii) Untuk Rugby League – Taruhan Handicap / Taruhan Handicap Alternatif (A) Dalam pasaran 2 arah, taruhan akan dinyatakan Tidak Berlaku jika hasil adalah seri. (iii) Untuk Rugby League – Total Points 2-Way / Alternative Total Points 2-Way / Team Total points 2-Way / Match and Team Totals (A) Dalam pasaran 2 arah, jika nilai skor adalah sama dengan poin yang dipasang, semua taruhan akan dinyatakan Tidak Berlaku. (iv) Total Points Ganjil/Genap, Team Total Ganjil/Genap, Team Totals Ganjil/Genap 2 arah (A) Untuk tujuan penyelesaian taruhan, hasil nol akan dihitung sebagai Genap. (v) Draw No Bet (A) Jika pertandingan berakhir imbang, taruhan akan dinyatakan sebagai Tidak Berlaku/Seri/Dikembalikan. (vi) Next Try 2-Way (A) Jika tidak tercetak poin pada try berikut, taruhan akan dinyatakan Tidak Berlaku. (vii) Total Tries / Team Total Tries / Most Tries Markets (termasuk alternatif) (A) Dalam pasaran 2 arah, jika nilai skor adalah sama dengan poin yang dipasang, taruhan akan dinyatakan Tidak Berlaku. Dalam pasaran ini, try termasuk penalty try. (viii) First Scoring Play/Team First Scoring Play/First Scoring Play 2nd Half/Score First (2nd Half)/Team to Score First/Team to Score First Try/Last Scoring Play of First Half/Last Scoring Play of Match/Team to Score Last/Team to Score Last Try (A) Untuk semua pasaran ini, try termasuk penalty try. Untuk semua pasaran scoring play, konversi tidak akan dihitung. (ix) Team scoring First Wins Game (A) Termasuk Babak Tambahan (jika ada). (x) Score 1st Try/1st Half Result (A) Untuk memprediksi tim yang akan mencetak try pertama, dikombinasikan dengan Hasil Babak Pertama. Pilihan No Try Scorer bisa saja ditawarkan. Untuk pasaran ini, try termasuk penalty try. (xi) Team to Score 1st and Match Result (A) Untuk memprediksi tim yang pertama mencetak skor, dikombinasikan dengan hasil pertandingan, termasuk Babak Tambahan (jika ada). (xii) Highest Scoring Half/ Team with Highest Scoring Half (A) Total Babak Kedua tidak termasuk Babak Tambahan (jika ada). Pilihan Seri tersedia. (xiii) Double Result (A) Untuk memprediksi hasil paruh babak dan babak penuh dari pertandingan yang ditentukan. (xiv) Winning Margin Including Exact and Alternative (A) Untuk tujuan penyelesaian taruhan, margin pada babak penuh yang akan dihitung (Pilihan Seri tersedia). (xv) Race to Markets (A) Untuk memprediksi tim mana yang mencapai total poin yang ditentukan terlebih dahulu (Pilihan Neither/Tidak Keduanya tersedia). (xvi) Half Betting (A) Pasaran Babak Pertama akan diselesaikan pada akhir Babak Pertama. Pasaran Babak Kedua akan diselesaikan pada akhir waktu reguler dan termasuk Babak Tambahan (jika ada). Periode Babak yang bersangkutan harus selesai agar taruhan dinyatakan berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. (xvii) Untuk Rugby Union – semua Match Outcome (4 Arah)/Win in Extra-Time/To Lift Trophy/To Qualify/Match to Go to Overtime (A) Penyelesaian taruhan termasuk Babak Tambahan/Sudden Death dan Adu Tendangan (jika ada). (xviii) Untuk Rugby League – Taruhan Berjalan To Win in Overtime/To Qualify/To Lift Trophy (A) Jika ditawarkan, semua pasaran akan diselesaikan termasuk semua Babak Tambahan (jika ada). (xix) In-Play/Live Half Betting (A) Untuk Taruhan Berjalan Paruh Babak, periode paruh babak yang ditentukan harus selesai agar taruhan dinyatakan berlaku (kecuali jika hasil dari pasaran tertentu telah dapat ditentukan). Taruhan Berjalan Paruh Babak tidak menghitung Babak Tambahan (jika ada), dan jika hasil pasaran 2 arah Paruh Babak adalah seri, taruhan akan dinyatakan Tidak Berlaku/Seri/Dikembalikan. (xx) Total Team Tries (A) Penalty try dihitung. Taruhan hanya berlaku untuk waktu reguler. (xxi) Team to Score First/Last Try (A) Pilihan No Try Scored tersedia. (xxii) Team to Score First/Last (A) Termasuk Babak Tambahan (jika ada). (xxiii) Team to Win Both Halves/To Win Both Halves/Team to Win Either Half (A) Kedua Babak harus selesai agar taruhan dinyatakan berlaku. (xxiv) First/Last/Anytime Tryscorer Markets (A) Jika pemain tidak berpartisipasi dalam pertandingan, taruhan pada pemain tersebut akan dinyatakan Tidak Berlaku/Dikembalikan. (xxv) First Try Scorer (A) Jika pemain yang dipasang memasuki lapangan setelah dicetaknya try pertama, taruhan pada pemain tersebut akan dinyatakan Tidak Berlaku/Dikembalikan. Jika pemain yang dipasang memasuki lapangan sebelum try pertama dicetak, taruhan akan tetap berlaku. Penalty try tidak dihitung dalam pasaran ini. Jika try pertama adalah penalty try, pemain yang mencetak try kedua yang akan dihitung sebagai pemenang. (xxvi) Last Try Scorer (A) Taruhan akan berlaku untuk pemain yang berpartisipasi dalam pertandingan untuk tujuan penentuan last try scorer. Jika try terakhir adalah penalty try, taruhan pada pencetak try sebelumnya yang menang. (xxvii) Total Team Tries (A) Penalty try dihitung. Taruhan hanya berlaku untuk waktu reguler. (xxviii) Will Either/Any Team Score 3 Unanswered Tries? (A) Salah Satu Tim harus mencetak 3 try tanpa bisa dibalas oleh tim lawan. Penalty try dihitung. Pasaran lain yang terpengaruh oleh jadwal turnamen yang tidak lengkap akan dinyatakan Tidak Berlaku, kecuali untuk pasar yang hasilnya telah dapat ditentukan. (xxix) Lance Todd Trophy (A) Berlaku untuk Rugby League Challenge Cup Final. The Man of the Match diputuskan pada akhir pertandingan dan memperoleh The Lance Todd Trophy. Harga ditawarkan untuk setiap pemain yang berpartisipasi dalam pertandingan. (xxx) Outright (xxxi) Rugby Specials (A) Jika terdapat dua tim atau lebih mencapai babak yang sama dalam suatu kompetisi, peraturan dead heat akan berlaku. (B) Untuk pasaran 'total/match/team try', penalty try akan dihitung. (C) Jika dua tim bersamaan mencapai posisi teratas pada suatu liga/grup tertentu, maka peraturan kompetisi resmi akan menentukan pemenang untuk tujuan penyelesaian taruhan. (D) Pasaran lain yang terpengaruh oleh jadwal turnamen yang tidak lengkap akan dinyatakan Tidak Berlaku, kecuali untuk pasar yang hasilnya telah dapat ditentukan.\n(b) Sistem skoring: Tipe Skoring B berlaku.` },
      { id: 's37', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA LAYAR', content: `37.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Layar:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's38', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA MENEMBAK', content: `38.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Menembak:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's39', category: 'OLAHRAGA TERTENTU', title: 'SKUAS', content: `39.1 Semua taruhan dinyatakan TIDAK BERLAKU, jika pertandingan belum diselesaikan, kecuali untuk Period Betting (jika taruhan telah ditentukan tanpa syarat).\n\n39.2 Jumlah total permainan yang diperlukan untuk memenangkan pertandingan adalah ditentukan oleh pihak resmi dari penyelenggara turnamen.\n\n39.3 Pada situasi dimana jumlah permainan yang sah diganti atau berbeda dengan yang ditawarkan untuk taruhan, semua taruhan dinyatakan tidak berlaku.\n\n39.4 Berikut adalah taruhan-taruhan yang ditawarkan pada Skuas:\n(a) Taruhan Non Live: (i) Handicap Asia (A) Game Handicap (B) Poin Handicap (ii) Ganjil/Genap (A) Taruhan Ganjil/Genap diselesaikan berdasarkan jumlah total poin yang dimainkan dalam pertandingan termasuk poin yang ditambahkan ketika pertandingan SERI (jika ada). (iii) Outright (iv) Atas/Bawah (A) Taruhan Atas/Bawah diselesaikan berdasarkan jumlah total poin yang dimainkan dalam pertandingan termasuk poin yang ditambahkan ketika pertandingan SERI. (v) Period Betting (A) Semua taruhan diselesaikan berdasarkan jumlah total Poin yang dimainkan pada akhir Permainan. (B) Semua taruhan akan dinyatakan berlaku jika periode yang ditentukan selesai, terlepas jika pertandingan ditinggalkan setelahnya.\n(b) Taruhan Berjalan ("Live"): (i) Handicap Asia (A) Game Handicap (B) Poin Handicap (ii) Period Betting\n(c) Sistem Skoring: Tipe Skoring B berlaku` },
      { id: 's40', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA RENANG', content: `40.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Renang:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's41', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA RENANG INDAH', content: `41.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Renang Indah:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's42', category: 'OLAHRAGA TERTENTU', title: 'TENIS MEJA', content: `42.1 Peraturan 12 jam tidak berlaku untuk taruhan Tenis Meja.\n\n42.2 Berikut adalah taruhan-taruhan yang ditawarkan pada Tenis Meja:\n(a) Taruhan Non Live: (i) Handicap Asia (A) Poin Handicap (B) Set Handicap (ii) Money Line (iii) Ganjil/Genap (iv) Outright (v) Atas/Bawah (vi) Taruhan Berperiode\n(b) Taruhan Berjalan ("Live")\n\n42.3 Dimana dapat diberlakukan, presentasi podium akan menentukan penyelesaian taruhan. Diskualifikasi dan/atau banding yang terjadi setelahnya tidak akan mempengaruhi hasil taruhan. Jika salah satu nama pemain dalam pertandingan berubah sebelum pertandingan dimulai maka semua taruhan dinyatakan Tidak Berlaku. Dalam hal pertandingan dimulai tetapi tidak diselesaikan, semua taruhan akan dinyatakan Tidak Berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan, atau jika permainan dan/atau pertandingan tidak memungkinkan untuk dimainkan sampai akhir tanpa menentukan hasil dari suatu pasaran.\n(a) In-Play/Live Game Markets (Current and Next) - Pertandingan yang ditentukan harus selesai dimainkan agar taruhan tetap berlaku, kecuali untuk pasar yang hasilnya telah dapat ditentukan.\n(b) Langsung (In-Play)/Live Race to Markets - Taruhan diselesaikan berdasarkan pemain pertama yang mencapai jumlah poin yang yang ditentukan terlebih dahulu. Jika tidak ada pemain yang mencapai jumlah poin yang ditentukan (karena dihentikan) maka taruhan pada pasar tersebut akan dinyatakan Tidak Berlaku. Jika pertandingan tidak dimainkan, maka semua pasar race market untuk pertandingan tersebut akan dinyatakan Tidak Berlaku.\n(c) Taruhan Poin In-Play/Live - Taruhan ditawarkan bagi pemain untuk memenangkan poin yang ditentukan. Jika poin tidak dimainkan, karena pertandingan berakhir, semua taruhan pada poin tersebut akan dinyatakan Tidak Berlaku.\n(d) Total Point Betting markets - Didasarkan pada jumlah permainan yang dimainkan menurut ketentuan yang berlaku. Jika jumlah permainan menurut ketentuan diubah atau berbeda dari yang ditawarkan untuk taruhan, maka semua taruhan dinyatakan Tidak Berlaku.\n(e) In-Play/Live Handicap Betting - Pasaran berdasarkan pada jumlah permainan yang dimainkan ketentuan yang berlaku. Jika jumlah permainan menurut ketentuan yang berlaku diubah atau berbeda dari yang ditawarkan untuk tujuan taruhan, maka semua taruhan dinyatakan Tidak Berlaku.\n\n42.4 Sistem skoring: Tipe Skoring B berlaku.` },
      { id: 's43', category: 'OLAHRAGA TERTENTU', title: 'TAEKWONDO', content: `43.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Taekwondo:\n(a) Taruhan Non Live: (i) Head to Head (A) Kedua kompetitor yang dipasangkan harus memulai dan menyelesaikan permainan agar taruhan tetap berlaku. (B) Jika terdapat salah satu kompetitor tidak ikut serta dalam perlombaan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's44', category: 'OLAHRAGA TERTENTU', title: 'TENIS', content: `44.1 Semua taruhan dinyatakan TIDAK BERLAKU jika pertandingan tidak diselesaikan di mana dikarenakan oleh pengunduran diri atau diskualifikasi, kecuali untuk taruhan berikut ini: First Ace, First Double Fault dan Period Betting (jika taruhan ini telah ditentukan tanpa syarat).\n\n44.2 Semua taruhan dinyatakan TIDAK BERLAKU jika durasi permainan pada turnamen dikurangi, ditunda atau dibatalkan, kecuali untuk pasaran di mana telah ditentukan tanpa syarat.\n\n44.3 Jumlah total set yang diperlukan untuk memenangkan pertandingan adalah ditentukan oleh pihak resmi dari penyelenggara turnamen.\n\n44.4 Peraturan 12 jam tidak berlaku untuk taruhan Tenis.\n\n44.5 Semua taruhan tetap berlaku terlepas dari pergantian lokasi ataupun lapangan.\n\n44.6 Berikut adalah taruhan-taruhan yang ditawarkan pada Tenis:\n(a) Taruhan Non Live: (i) Handicap Asia (A) Game Handicap (B) Set Handicap (ii) First Ace (A) Bertaruh pada pemain yang melakukan first Ace pada pertandingan sesuai dengan statistik pertandingan resmi. (iii) First Double Fault (A) Bertaruh pada pemain yang melakukan first double fault pada pertandingan sesuai dengan statistik pertandingan resmi. (iv) Most Aces (A) Bertaruh pada pemain yang memiliki Ace terbanyak pada pertandingan sesuai dengan statistik pertandingan resmi. (v) Most Double Fault (A) Bertaruh pada pemain yang memiliki double fault terbanyak pada pertandingan sesuai dengan statistik pertandingan resmi. (vi) Ganjil/Genap (A) Taruhan Ganjil/Genap diselesaikan berdasarkan total jumlah permainan yang dimainkan pada pertandingan termasuk permainan yang ditambahkan ketika pertandingan Seri (jika ada) untuk menghasilkan angka ganjil atau genap. (vii) Outright (viii) Atas/Bawah (A) Taruhan Atas/Bawah diselesaikan berdasarkan total jumlah permainan yang dimainkan pada akhir pertandingan termasuk permainan yang dimainkan ketika pertandingan Seri (jika ada). (ix) Period Betting (A) Semua taruhan diselesaikan berdasarkan total jumlah permainan yang dimainkan pada akhir set, termasuk permainan yang dimainkan ketika pertandingan Seri.\n(b) Taruhan Berjalan ("Live"): (i) Handicap Asia (ii) Atas/Bawah (iii) Period Betting\n(c) Sistem Skoring: Tipe Skoring B berlaku\n\n44.7 Taruhan e-Tennis: (a) Kecuali jika dinyatakan pada Peraturan 45.7, maka Peraturan 45 yang akan berlaku. (b) e-Tennis adalah pertandingan yang disimulasi berdasarkan Kecerdasan Buatan (Artificial Intelligence), Pembelajaran Mesin (Machine Learning) dan riwayat data base tennis untuk mencerminkan bentuk tim dan permainan pertandingan. (c) Hasil pertandingan e-Tennis, skor dan data penentu taruhan lainnya dihasilkan oleh perangkat lunak dan tidak tersedia sumber lain, termasuk dari tim resmi atau situs liga pertandingan. (d) e-Tennis adalah pertandingan yang disiarkan dan termasuk pertandingan Taruhan Umum, pada Pengguna Akhir dapat bertaruh pada pertandingan tertentu. Hasil pada pertandingan tersebut akan menentukan perhitungan dari taruhan yang ditempatkan oleh semua Pengguna Akhir. (e) Apabila suatu pertandingan tidak selesai dalam waktu yang dijadwalkan karena kesalahan teknis apapun, termasuk bukan hanya kesalahan computer, elektronik, perangkat lunak, perangkat keras ataupun koneksi, pertandingan akan diselesaikan dengan status pertandingan tidak selesai dimainkan., kecuali penyelesaian taruhan sudah dapat ditentukan, seperti pasar tertentu misalnya, (x) Set – (x) Game – Pemenang, (x) Set – (x) Game – Poin (x) Pemenang, (x) Set – (x) Game To Deuce, (x) Set – Race to (x) Games, dll. Dalam hal ini taruhan yang diselesaikan hanya taruhan yang telah ditentukan tanpa syarat. Untuk pasar lainnya dan terlepas dari hasil indikatif apapun, taruhan akan dinyatakan tidak berlaku dan modal taruhan akan dikembalikan ke Pengguna Akhir. Operator akan menyelesaikan pertandingan tersebut sesuai dengan aturan ini dan keputusan Operator akan dianggap final. (f) Operator berhak menyatakan sebuah taruhan e-Tennis tidak berlaku apabila; (i) sebagian atau perincian taruhan yang tidak tepat; (ii) Pengguna Akhir dicurigai berpartisipasi dalam penipuan, kolusi, pencucian uang atau kegiatan illegal lainnya; (iii) pertandingan tidak dimainkan atau tidak selesai atau hasil pertandingan tidak dapat ditentukan; (iv) penerimaan taruhan akan melampaui batas maksimum bertaruh; (v) jumlah kredit taruhan tidak tersedia di akun pemain; (vi) terjadi kesalahan (manusia atau lainnya) atau kegagalan sistem yang mengakibatkan odds yang ditawarkan tidak tepat; (vii) kesalahan teknis seperti kegagalan komunikasi, kecacatan, gangguan, keterlambatan, virus, penolakan layanan, atau data rusak; atau (viii) jika terjadi kesalahan teknis yang menghasilkan pembayaran yang tidak wajar. (g) Apabila terjadi kesalahan (manusia atau lainnya) atau kegagalan system saat perhitungan taruhan, penyelesaian akan dianggap tidak valid dan diperbaiki sebagaimana mestinya. Apabila Pengguna Akhir tidak memiliki kredit yang mencukupi di dalam akun, maka dalam kondisi ini, Pengguna Akhir akan diminta untuk mengembalikan jumlah dana yang diperlukan kepada Operator.` },
      { id: 's45', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA TRILOMBA', content: `45.1 Berikut adalah taruhan-taruhan yang ditawarkan dalam Olahraga Trilomba:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's46', category: 'OLAHRAGA TERTENTU', title: 'BOLA VOLI', content: `46.1 Peraturan 12 jam tidak berlaku untuk taruhan Bola Voli.\n\n46.2 Berikut adalah taruhan-taruhan yang ditawarkan pada Bola Voli:\n(a) Taruhan Non Live: (i) Handicap Asia (A) Poin Handicap (B) Set Handicap (ii) Money Line (iii) Ganjil/Genap (iv) Outright (v) Atas/Bawah (vi) Taruhan Berperiode (vii) Point Betting\n(b) Taruhan Berjalan ("Live")\n\n46.3 Non Live (Pra-Pertandingan): (a) Taruhan berikut akan dinyatakan TIDAK BERLAKU jika pertandingan tidak diselesaikan, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan: (i) To Win Match (ii) Match Total Ganjil/Genap (iii) Tebak Skor Set (iv) Double Result (Hasil Set Pertama dan Match) (v) Match Handicap - Sets (vi) Match Handicap - Points (vii) Total Poin (viii) Tim Total Poin (b) Untuk pasaran set individual, taruhan dinyatakan TIDAK BERLAKU jika set tidak diselesaikan, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan: (i) Pemenang Set Pertama (ii) Ganjil/Genap Set Pertama (iii) Handicap Set Pertama (iv) Total Poin Set Pertama (v) Winning Margin Set Pertama (vi) Tebak Skor Set Pertama (vii) Skor Setelah 2/3 Sets (c) Jika terjadi pengurangan poin yang diberlakukan oleh wasit, hasil resmi akan digunakan untuk penyelesaian taruhan pada semua pasaran. (d) Jika terjadi pergantian arena pertandingan maka taruhan akan tetap berlaku selama Tim Tuan Rumah masih ditetapkan menjadi tuan rumah. Jika posisi Tim Tuan Rumah dan Tamu dalam suatu pertandingan dicantumkan terbalik, maka taruhan akan dinyatakan TIDAK BERLAKU. (e) Pasaran "to qualify" akan ditentukan pada tim yang maju ke babak selanjutnya dari kompetisi yang ditentukan dan termasuk hasil Golden Set jika dimainkan. Untuk kompetisi two legged ties, Golden Set akan dihitung untuk menentukan tim mana yang maju. Golden Set tidak dihitung untuk penyelesaian pasar pertandingan normal/set reguler. (f) Semua taruhan dinyatakan TIDAK BERLAKU, jika pertandingan tidak diselesaikan, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan.\n\n46.4 Taruhan Berjalan ("In-Play/Live"): (a) Taruhan berikut akan dinyatakan TIDAK BERLAKU jika pertandingan tidak diselesaikan, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan: (i) To Win Match (ii) Set Betting (iii) Total Match Points (iv) Team Total Match Points (v) Handicap Set Betting (b) Untuk pasaran set individual, taruhan dinyatakan TIDAK BERLAKU jika set tidak diselesaikan, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. (c) Taruhan ditawarkan bagi pemain untuk memenangkan poin yang ditentukan. Jika poin tidak dimainkan, karena pertandingan berakhir, semua taruhan pada poin tersebut akan dinyatakan TIDAK BERLAKU. (d) Current/Next Set Leader After: Jika jumlah poin tidak tercapai dalam set yang ditentukan, maka tim yang memenangkan set tersebut akan ditetapkan sebagai pemenang. (e) Jika terjadi pengurangan poin yang diberlakukan oleh wasit, hasil resmi akan digunakan untuk penyelesaian taruhan, kecuali pasaran "Race to Markets" dan "Point Betting" yang telah dapat ditentukan. (f) Golden Set (jika ada dan jika ditawarkan) dihitung hanya berdasarkan apa yang terjadi pada Golden Set tersebut.\n\n46.5 Sistem Skoring yang berlaku: Tipe Skoring B.` },
      { id: 's47', category: 'OLAHRAGA TERTENTU', title: 'POLO AIR', content: `47.1 Taruhan akan diselesaikan berdasarkan skor akhir setelah pertandingan selesai dimainkan (termasuk tambahan waktu) namun tidak termasuk babak tambahan dan adu penalti kecuali jika terdapat hal lain yang ditetapkan.\n\n47.2 Jika suatu pertandingan ditinggalkan sebelum 32 menit dimainkan, semua taruhan pada pertandingan tersebut dianggap TIDAK BERLAKU kecuali taruhan yang telah ditentukan.\n\n47.3 Berikut adalah taruhan-taruhan yang ditawarkan pada Polo Air:\n(a) Taruhan Non Live: (i) Handicap Asia (ii) Ganjil/Genap (iii) Outright (iv) Atas/Bawah (v) Period Betting (vi) Taruhan Paruh Babak (A) Sehubungan dengan taruhan babak pertama, taruhan diselesaikan berdasarkan jumlah skor dari kuarter 1 dan kuarter 2 termasuk handicap dalam menentukan pemenang. (vii) Taruhan Kuarter (A) Taruhan diselesaikan berdasarkan skor yang diperoleh pada akhir setiap kuarter termasuk handicap dalam menentukan pemenang. (B) Untuk taruhan kuarter ke-4, poin yang dicetak pada babak tambahan atau adu penalti dikecualikan dalam penentuan pemenang.\n(b) Taruhan Berjalan ("Live"): (i) Handicap Asia\n(c) Sistem Skoring: Tipe Skoring B berlaku` },
      { id: 's48', category: 'OLAHRAGA TERTENTU', title: 'ANGKAT BESI', content: `48.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Angkat Besi:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, maka taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's49', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA MUSIM DINGIN', content: `49.1 Hasil pada saat presentasi podium yang akan diperhitungkan. Jika tidak terdapat upacara presentasi, hasilnya akan ditentukan seusai dengan hasil resmi seperti yang diumumkan oleh badan pengatur resmi pada akhir pertandingan, terlepas dari banding yang terjadi setelahnya, diskualifikasi ataupun perubahan pada hasil.\n\n49.2 Jika suatu pertandingan ditunda atau dibatalkan dan tidak dilanjutkan kembali dalam kurun waktu 48 jam dari waktu mulai yang dijadwalkan, semua taruhan dinyatakan tidak berlaku dan taruhan akan dikembalikan.\n\n49.3 Jika kondisi suatu event (termasuk namun tidak terbatas pada perubahan lokasi event, dipersingkat bagian atau ronde dari event, mengubah jarak resmi dari event tertentu), diubah dari yang semula didaftarkan oleh Badan Pengatur Resmi maka semua taruhan dinyatakan tidak berlaku. Untuk event Cross-Country dan Biathlon, taruhan tidak akan berlaku jika jarak dari resmi (terdaftar) diubah, tetapi akan berlaku jika jarak sebenarnya adalah berbeda. Untuk event ski-jumping, hasilnya akan berlaku jika pasaran yang menyediakan satu ronde selesai secara penuh.\n\n49.4 Berikut adalah taruhan-taruhan yang ditawarkan pada Semua Olahraga Musim Dingin:\n(a) Taruhan Non Live: (i) Head To Head (A) Pada taruhan Head to Head, kedua kompetitor yang dipasangkan harus memulai kompetisi agar taruhan dinyatakan berlaku. (B) Pasaran Head to Head mengacu pada kompetitor dengan posisi akhir terbaik. (C) Jika satu dari dua kompetitor didiskualifikasi atau menarik diri setelah memulai ronde tersebut maka kompetitor lainnya akan dianggap sebagai pemenang. (D) Jika satu dari dua kompetitor didiskualifikasi atau menarik diri setelah memulai, baik sebelum menyelesaikan ronde pertama, atau setelah kedua kompetitor lolos ke ronde selanjutnya maka kompetitor lainnya akan dianggap sebagai pemenang. (E) Jika kedua kompetitor didiskualifikasi pada ronde yang berbeda, yang menjadi pemenang adalah kompetitor dengan ronde terjauh. (F) Curling – Semua taruhan dinyatakan TIDAK BERLAKU, jika pertandingan tidak selesai. Apabila skor adalah Seri setelah 10 end berakhir, end tambahan akan dihitung pada semua pasaran. (G) Nordic Combined – Agar taruhan berlaku, kompetitor yang dipasangkan harus memulai bagian pertama dan kedua dari event. (ii) Outright` },
      { id: 's50', category: 'OLAHRAGA TERTENTU', title: 'GULAT', content: `50.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Gulat:\n(a) Taruhan Non Live: (i) Head to Head (A) Kedua kompetitor yang dipasangkan harus memulai dan menyelesaikan permainan agar taruhan dinyatakan berlaku. (B) Jika terdapat salah satu kompetitor tidak ikut serta dalam perlombaan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
    ];

    // DOM refs
    const container = document.getElementById('cardContainer');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const totalRulesSpan = document.getElementById('totalRules');
    const totalSportsSpan = document.getElementById('totalSports');
    const copyAllBtn = document.getElementById('copyAllBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMessage');

    function showToast(msg = 'Tersalin!') {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function copyTextToClipboard(text, successMsg = 'Tersalin!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(successMsg);
        }).catch(() => {
          fallbackCopy(text, successMsg);
        });
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-9999px';
      textArea.style.top = '-9999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        const success = document.execCommand('copy');
        if (success) showToast(successMsg);
        else showToast('Gagal menyalin, coba manual.');
      } catch (e) {
        showToast('Gagal menyalin, coba manual.');
      }
      document.body.removeChild(textArea);
    }

    function renderCards(filterText = '') {
      const term = filterText.toLowerCase().trim();
      let filtered = rulesData;

      if (term !== '') {
        filtered = rulesData.filter(item => {
          const matchTitle = item.title.toLowerCase().includes(term);
          const matchContent = item.content.toLowerCase().includes(term);
          const matchCategory = item.category.toLowerCase().includes(term);
          return matchTitle || matchContent || matchCategory;
        });
      }

      totalRulesSpan.textContent = filtered.length;
      const sportSet = new Set();
      rulesData.forEach(r => {
        if (!r.category.includes('A.') && !r.category.includes('B.')) {
          sportSet.add(r.category);
        }
      });
      totalSportsSpan.textContent = sportSet.size;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-message">
            <i class="fas fa-search-minus"></i>
            Tidak ada hasil untuk "<strong>${term}</strong>"
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(item => {
        let icon = 'fas fa-file-alt';
        if (item.category.includes('A.')) icon = 'fas fa-list-ul';
        else if (item.category.includes('B.')) icon = 'fas fa-gavel';
        else icon = 'fas fa-dumbbell';

        let badge = item.category;
        if (badge.length > 30) badge = badge.slice(0, 28) + '…';

        // tampilkan konten penuh (tidak dipotong)
        let displayContent = item.content;
        // ganti newline dengan <br> untuk tampilan HTML
        displayContent = displayContent.replace(/\n/g, '<br>');

        html += `
          <div class="card" data-id="${item.id}">
            <div class="card-header">
              <i class="${icon}"></i>
              <span class="card-title">${item.title}</span>
              <span class="badge-section">${badge}</span>
            </div>
            <div class="card-body">
              <p>${displayContent}</p>
            </div>
            <div class="card-footer">
              <span><i class="far fa-clock"></i> Berlaku</span>
              <span class="char-count">${item.content.length} karakter</span>
              <button class="copy-btn" data-id="${item.id}" data-title="${item.title}" data-content="${item.content}">
                <i class="fas fa-copy"></i> Salin
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const title = this.getAttribute('data-title');
          const content = this.getAttribute('data-content');
          const textToCopy = `${title}\n\n${content}`;
          copyTextToClipboard(textToCopy, `"${title}" tersalin!`);
        });
      });
    }

    // Salin SEMUA JENIS TARUHAN (A. JENIS TARUHAN)
    function copyAllBetTypes() {
      const betTypes = rulesData.filter(r => r.category.includes('A. JENIS TARUHAN'));
      if (betTypes.length === 0) {
        showToast('Tidak ada data jenis taruhan.');
        return;
      }
      let text = '========================================\n';
      text += '       JENIS TARUHAN (LENGKAP)\n';
      text += '========================================\n\n';
      betTypes.forEach((item, idx) => {
        text += `${idx+1}. ${item.title}\n${'-'.repeat(item.title.length + 4)}\n${item.content}\n\n`;
      });
      text += '========================================\n';
      text += `Total ${betTypes.length} jenis taruhan`;
      copyTextToClipboard(text, `✅ ${betTypes.length} jenis taruhan tersalin!`);
    }

    copyAllBtn.addEventListener('click', copyAllBetTypes);

    function performSearch() {
      renderCards(searchInput.value);
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') performSearch();
    });
    searchInput.addEventListener('input', function() {
      if (this.value === '') renderCards('');
    });

    renderCards();
  })();
</script>
</body>
</html>
