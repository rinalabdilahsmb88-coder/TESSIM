an Berjalan ("Live"):\n(a) Taruhan Pertandingan, Tim dan Pemain: (i) 1X2 (A) Untuk pertandingan first-class, jika hasil resmi adalah seri, maka taruhan akan diselesaikan sesuai dengan peraturan dead heat Kriket antara kedua tim. Taruhan untuk pilihan seri akan diselesaikan dengan status kalah. (ii) Batas di Over (iii) Pemenang lempar koin (A) jika tidak ada pelemparan yang dilakukan, maka seluruh taruhan akan dibatalkan. (iv) Metode Pemberhentian (v) Pemberhentian per Overs / Innings (vi) Kesempatan Ganda (vii) Draw No Bet (A) Untuk pertandingan first-class, hasil seri akan diselesaikan berdasarkan aturan dead heat Kriket. (viii) Skor Individual Tertinggi (ix) Opening Partnership Tertinggi (A) Semua taruhan akan berdasarkan pada jumlah Runs di Opening Partnership. (x) Man / Player of the Match (A) Taruhan akan diselesaikan sesuai pengumuman resmi untuk Man / Player of the match. (B) Jika Man / Player of the match tidak diumumkan secara resmi maka seluruh taruhan akan dibatalkan. (xi) Ducks Pertandingan / Total Ducks (A) Sebuah duck dikategorikan sebagai seorang batsman yang diberhentikan karena tidak mencetak run (zero runs). (B) Batsman yang mundur karena cedera tidak dihitung sebagai pemberhentian. (C) Ducks di super over tidak dihitung. (xii) Extra Pertandingan / Total Extra (A) Semua wide deliveries, no balls, byes, leg byes, dan run penalty di pertandingan diperhitungkan dalam hasil akhir. Jika terdapat run off the bat serta extra dari delivery yang sama, maka run off the bat tidak akan dihitung dalam total akhir. (B) Extra di super over tidak dihitung. (xiii) Match Fours / Total Fours (A) Hanya skor four (empat) dari bat (dari delivery apapun – sah atau tidak) akan dihitung dalam total fours. Overthrows, semua run fours dan extra tidak akan dihitung. (B) Fours dari super over tidak dihitung. (xiv) Match Run Outs / Total Run Outs (A) Run outs di super over tidak akan dihitung. (xv) Match Sixes / Total Sixes (A) Setiap run yang dihasilkan dari wide delivery, kecuali run penalty, tidak akan dihitung ke total akhir. (B) Wides di super over tidak dihitung. (xvi) Match Wides / Total Wides (A) Setiap runs yang dihasilkan dari wide delivery, kecuali penalty runs, akan dihitung terhadap total akhir. (B) Wides dalam super over tidak dihitung. (xvii) Wicket Pertandingan / Total Wicket (A) Taruhan diterima pada jumlah total wicket yang akan jatuh dalam pertandingan. (B) Seorang batsman yang mundur karena cedera tidak dihitung dalam wicket. (C) Wicket di super over tidak dihitung. (xviii) Maksimum Over dalam pertandingan (A) Prediksi run yang dicetak dalam highest scoring over dalam pertandingan. (B) Semua run, termasuk extra, dihitung dalam penyelesaian taruhan. (C) Super over tidak dihitung. (xix) Tangkapan Terbanyak (A) Taruhan pada tim yang akan akan melakukan tangkapan terbanyak, termasuk tangkapan dari fielder dan penjaga wicket. (B) Untuk pertandingan first-class, hanya tangkapan di inning pertama yang akan dihitung (C) Tangkapan di babak super over tidak dihitung. (xx) Extra Terbanyak (A) Semua wide deliveries, no balls, byes, leg byes, dan run penalty di pertandingan diperhitungkan dalam hasil akhir. Jika terdapat run off the bat serta extra dari delivery yang sama, maka run off the bat tidak akan dihitung dalam total akhir. (B) Extra di super over tidak dihitung. (C) Untuk pertandingan first-class, hanya extra di inning pertama yang akan dihitung. (xxi) Fours Terbanyak (A) Hanya fours yang dicetak dari pukulan / bat (dari delivery manapun – sah atau tidak ) yang akan dihitung dalam total fours. Overthrows, semua run fours dan extra tidak dihitung. (B) Fours yang dicetak dalam babak super over tidak dihitung. (C) Untuk pertandingan first-class, hanya four dalam inning pertama yang dihitung. (xxii) Tangkapan Penjaga Gawang Terbanyak (A) Jika sebuah tim mengganti penjaga wicket di pertengahan inning, maka tangkapan yang dilakukan oleh penggantinya akan dihitung dalam penyelesaian taruhan. (B) Tangkapan yang dilakukan di super over tidak dihitung. (C) Untuk pertandingan first-class, hanya tangkapan inning pertama yang dihitung. (xxiii) Most Sixes (A) Hanya sixes yang dicetak dari bat (off dan delivery – sah atau tidak) akan dihitung dalam total sixes. Overthrows dan extras tidak dihitung. (B) Sixes dicetak di babak super over tidak dihitung. (C) Untuk pertandingan first-class, hanya sixes di inning pertama yang dihitung. (xxiv) Stumpings Terbanyak (A) Untuk pertandingan first-class, hanya stumpings di inning pertama yang dihitung. (B) Stumpings didapatkan di babak super over tidak dihitung. (xxv) Outright (xxvi) Atas / Bawah (xxvii) Head to Head Pemain (A) Jika pemain tidak melakukan bat atau bowl, tetapi berada di garis sebelas, semua taruhan akan tetap berlaku. Jika pemain tidak masuk dalam garis sebelas, taruhan akan dibatalkan. (B) Hasil taruhan telah dapat ditentukan jika garis di mana taruhan dipasang telah dilewati. (C) Untuk pertandingan kelas satu, hanya inning pertama yang dihitung. (xxviii) Performa Pemain (A) Pasaran ini menggunakan sistem penilaian berbasis poin untuk menentukan hasilnya. Ini adalah skor gabungan dengan 1 poin per run, 20 poin per wicket, 10 poin per tangkapan dan 25 poin per stumping. (xxix) Rabbit Runs (A) Taruhan pada total run yang dicetak dari batsman bernomor 11 dalam pertandingan. (B) Batsman nomor 11 dianggap sebagai pemain terakhir yang melakukan bat dalam inning, terlepas dari urutan yang dinyatakan sebelumnya. Jika lebih dari 11 pemain memukul, semua taruhan di pasaran tersebut akan dibatalkan. (C) Jika inning diselesaikan tanpa batsman nomor 11 datang ke crease, batsman akan dianggap mencetak skor nol (zero). (xxx) Runs di First Over (A) Over pertama harus diselesaikan agar taruhan dinyatakan berlaku kecuali seluruh pilihan taruhan dapat diselesaikan karena hasil dari taruhan telah dapat ditentukan. (B) Jika suatu inning berakhir di pertengahan over, maka over tersebut akan dianggap selesai kecuali inning tersebut diakhiri karena faktor eksternal, termasuk namun tidak terbatas pada, cuaca buruk, dalam hal ini semua taruhan akan dibatalkan, kecuali seluruh pilihan taruhan dapat diselesaikan karena hasil dari taruhan telah dapat ditentukan. (C) Untuk pertandingan first-class, pasaran mengacu hanya pada inning pertama dari masing-masing tim. (D) Run extra dan penalty dalam over tertentu tidak dihitung. (E) Untuk tujuan penyelesaian taruhan, seorang batsman mundur karena cedera tidak dihitung sebagai wicket. (F) Untuk pertandingan first-class, pasaran hanya merujuk ke inning pertama masing-masing tim. (xxxi) Runs di Opening Partnership (A) Jika tim yang memukul mencapai akhir dari over yang tersedia atau mencapai target runs mereka atau ditetapkan sebelum wicket pertama jatuh, hasil adalah total run yang terkumpul. (B) Hasil akan dianggap sah jika angka / pasaran dari taruhan telah terlewati, atau jika wicket telah jatuh. (C) Untuk penyelesain taruhan, seorang batsman yang mengundurkan diri karena cedera tidak dihitung sebagai wicket. (D) Untuk pertandingan first-class, pasaran hanya mengacu pada inning pertama masing-masing tim. (xxxii) Runs in Groups of Overs (A) Jika jumlah over yang ditentukan tidak selesai, taruhan akan dibatalkan, kecuali tim all out atau menyatakan atau mencapai target run mereka atau seluruh pilihan taruhan dapat diselesaikan karena hasil dari taruhan telah dapat ditentukan sebelum pengurangan. (B) Untuk pertandingan first-class, pasaran hanya merujuk ke inning pertama. (xxxiii) Runs off Delivery Pertama (A) Untuk tujuan penyelesaian, semua bola tidak sah dihitung sebagai delivery. Jika over dimulai dengan wide (melebar), maka delivery pertama akan dihitung sebagai 1 dan, meskipun belum ada bola sah yang dilemparkan, bola berikutnya akan dianggap sebagai delivery kedua untuk over tersebut. (B) Jika delivery mengarah ke free hit, skor runs dari delivery tambahan yang didapatkan tidak dihitung. Semua runs, terlepas dari bat atau tidak akan dihitung. Sebagai contoh, wide dengan tiga extra run sama dengan 4 runs di total delivery tersebut. (C) Untuk pertandingan first-class, pasaran hanya merujuk pada inning pertama masing-masing tim. (xxxiv) Tim yang Menyelesaikan dengan Batasan (Team to Finish with a Boundary) (xxxv) Tim dengan Skor terbanyak pada setiap Dismissal (xxxvi) Tim dengan Skor Over Terbanyak (xxxvii) Tied Match (A) Untuk pertandingan first-class, seri adalah ketika tim pemukul di inning keempat telah bowled out ketika skor sedang seimbang. (xxxviii) Batsman Terbaik / Tim dengan Batsman Terbaik (A) Prediksi batsman dengan skor individual terbanyak dalam suatu pertandingan. (B) Pada pertandingan limited over, taruhan akan dibatalkan jika pertandingan tidak memungkinkan untuk diselesaikan dengan minimal 50% dari overs yang dijadwalkan di salah satu innings karena faktor eksternal, termasuk namun tidak terbatas pada, cuaca buruk. (C) Taruhan batsman terbaik untuk pertandingan first-class hanya berlaku pada inning pertama dari masing-masing tim, dan akan dibatalkan jika kurang dari 200 overs yang dilemparkan, kecuali semua inning pertama telah diselesaikan. (D) Jika seorang batsman telah ditunjuk lewat pelemparan koin, tetapi kemudian dikeluarkan sebagai pengganti, maka batsman itu akan tetap dihitung, begitu juga dengan batsman pengganti. (E) Jika ada dua batsman atau lebih mencetak run yang sama, maka peraturan dead heat Kriket akan berlaku. (F) Run dicetak di babak super over tidak dihitung. (xxxix) Top Bowler / Tim dengan Top Bowler (A) Prediksi bowler dengan wicket terbanyak dalam pertandingan. (B) Pada pertandingan limited over, taruhan akan dibatalkan jika pertandingan tidak memungkinkan untuk diselesaikan dengan minimal 50% dari overs yang dijadwalkan di salah satu innings karena faktor eksternal, termasuk namun tidak terbatas pada, cuaca buruk. (C) Taruhan top bowler pada pertandingan first-class hanya berlaku untuk inning pertama dari setiap tim, dan akan dibatalkan jika kurang dari 200 overs dilemparkan, kecuali inning pertama kedua tim telah diselesaikan. (D) Jika seorang bowler ditunjuk lewat pelemparan koin, tetapi kemudian dikeluarkan sebagai pengganti, bowler tersebut akan tetap dihitung, begitu pula dengan bowler penggantinya. (E) Jika ada dua bowler atau lebih mendapatkan jumlah wicket yang sama, bowler yang menerima run paling sedikit akan menjadi pemenangnya. Jika jumlah wicket dan run yang diterima sama, maka peraturan dead heat Kriket akan berlaku. (F) Wicket yang didapatkan di babak super over tidak dihitung. (xl) Total pada setiap Dismissal (xli) Total Dismissal (xlii) Total di Highest Scoring Over (xliii) Total Run per Over / Inning (xliv) Wicket di Groups of Overs (A) Taruhan mengacu pada wicket yang akan jatuh dalam jumlah over yang ditentukan. (B) Jika jumlah over yang ditentukan tidak selesai, maka taruhan akan dibatalkan, kecuali jika tim all out atau menyatakan atau mencapai target run mereka atau penyelesaian taruhan dapat dilakukan karena hasil taruhan telah ditentukan. (C) Untuk tujuan penyelesaian, jika seorang batsman time out atau mengundurkan diri maka wicket dianggap telah terjadi pada bola sebelumnya. Untuk tujuan penyelesaian, batsman yang mundur karena cedera tidak dihitung dalam dismissal. (D) Untuk pertandingan first-class, pasaran hanya merujuk pada inning pertama dari masing-masing tim.\n\n13.10 Sistem Skoring yang berlaku untuk taruhan Kriket adalah skoring Tipe B.` },
      { id: 's14', category: 'OLAHRAGA TERTENTU', title: 'BALAP SEPEDA', content: `14.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Balap Sepeda:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam sebuah perlombaan. (B) Kedua kompetitor harus memulai dan setidaknya satu harus menyelesaikan balapan agar taruhan berlaku. Jika kedua kompetitor yang dipasangkan gagal menyelesaikan balapan, taruhan dinyatakan tidak berlaku. (ii) Outright` },
      { id: 's15', category: 'OLAHRAGA TERTENTU', title: 'DARTS', content: `Kecuali dinyatakan berbeda, semua pertandingan yang Ditunda atau Dibatalkan akan dinyatakan Tidak Berlaku jika tidak dimainkan kembali atau dijadwalkan ulang dalam waktu 24 jam dari waktu mulai yang tertera.\n\n15.1 Taruhan Pra-Pertandingan: (a) Jika pertandingan dimulai tetapi tidak diselesaikan, pemain yang maju ke babak berikutnya atau dinyatakan menang akan dianggap sebagai pemenang untuk tujuan penyelesaian taruhan. (b) Untuk pertandingan Premier League Darts, pasaran dapat ditawarkan dalam format 3 arah dan 2 arah. Pasaran 3 arah menyediakan pilihan seri sedangkan pasaran 2 arah tidak. Untuk tujuan penyelesaian taruhan, taruhan pada pasaran 2 arah akan dinyatakan Tidak Berlaku apabila hasil pertandingan adalah seri.\n\n15.2 Handicap (2 arah) dan Taruhan Leg/Set (3 arah): (a) Jika jumlah leg/set pertandingan menurut ketentuan yang berlaku tidak diselesaikan, diubah atau berbeda dari yang ditawarkan untuk tujuan taruhan, maka semua taruhan akan dinyatakan Tidak Berlaku. Semua taruhan juga akan dinyatakan TIDAK BERLAKU jika pertandingan tidak diselesaikan.\n\n15.3 Checkout Pemain Individu: (a) Jika pertandingan tidak selesai dimainkan, semua taruhan akan dinyatakan Tidak Berlaku kecuali poin yang ditawarkan telah dilewati.\n\n15.4 Pasaran Leg/Set Pertama: (a) Semua taruhan akan dinyatakan Tidak Berlaku jika leg/set pertama tidak diselesaikan kecuali jika hasil telah dapat ditentukan.\n\n15.5 Memimpin Setelah 4/6 Leg: (a) 4/6 leg pertama harus selesai dimainkan agar taruhan dinyatakan Berlaku.\n\n15.6 Race to 3 Legs: (a) Salah satu pemain harus memenangkan 3 leg agar taruhan dinyatakan Berlaku.\n\n15.7 (a) Checkout Tertinggi (3 Arah): (i) Jika pertandingan tidak selesai dimainkan, semua taruhan akan dinyatakan Tidak Berlaku kecuali poin yang ditawarkan telah dilewati. (b) Checkout Tertinggi (2 Arah): (i) Jika pertandingan tidak selesai dimainkan, semua taruhan akan dinyatakan Tidak Berlaku kecuali poin yang ditawarkan telah dilewati. Apabila hasil seri, taruhan akan dinyatakan Tidak Berlaku.\n\n15.8 Pasaran Checkout Total: (a) Semua taruhan dinyatakan Tidak Berlaku jika pertandingan, atau leg/set yang ditentukan tidak selesai dimainkan (kecuali jika hasil taruhan telah dapat ditentukan). Dalam pasaran 2 arah, taruhan akan dinyatakan Tidak Berlaku jika hasil adalah seri.\n\n15.9 Checkout Leg Berikutnya: (a) Titik bull akan dihitung sebagai warna merah. Leg harus diselesaikan agar taruhan dinyatakan Berlaku.\n\n15.10 Total Leg/Set: (a) Jika pertandingan tidak selesai dimainkan, semua taruhan akan dinyatakan Tidak Berlaku kecuali poin yang ditawarkan telah dilewati.\n\n15.11 Pasaran Checkout: (a) Titik bull akan dihitung sebagai warna merah. Leg harus diselesaikan agar taruhan dinyatakan Berlaku.\n\n15.12 (a) Most 180s: (i) Semua taruhan dinyatakan Tidak Berlaku jika pertandingan tidak selesai dimainkan. (b) Pasaran 180s Total: (i) Semua taruhan dinyatakan Tidak Berlaku jika pertandingan, atau leg/set yang ditentukan tidak selesai dimainkan (kecuali jika hasil taruhan telah dapat ditentukan). (c) 180 Pertama: (i) Semua taruhan dinyatakan Tidak Berlaku jika pertandingan, atau leg/set yang ditentukan tidak selesai dimainkan (kecuali jika hasil taruhan telah dapat ditentukan). Apabila tidak ada 180 yang dihasilkan, taruhan akan dinyatakan Tidak Berlaku. (d) 170 Selesai dalam Pertandingan: (i) Semua taruhan dinyatakan Tidak Berlaku jika pertandingan, atau leg/set yang ditentukan tidak selesai dimainkan (kecuali jika hasil taruhan telah dapat ditentukan).\n\n15.13 Double Result (Leg/Set): (a) Untuk memprediksi jumlah set/leg dan pemenang keseluruhan pertandingan. Semua taruhan akan dinyatakan Tidak Berlaku jika pertandingan tidak selesai dimainkan.\n\n15.14 Pasaran Anak Panah Pertama: (a) Penyelesaikan dilakukan berdasarkan anak panah pertama atau set anak panah yang dilemparkan dalam set/leg yang ditentukan. Bounce Out akan dianggap sebagai Lainnya (Other) untuk tujuan penyelesaian taruhan. Dalam format pertandingan yang menerapkan Double In, taruhan akan dinyatakan Tidak Berlaku apabila pasaran ditawarkan secara keliru.\n\n15.15 9 Dart Finish: (a) Semua taruhan dinyatakan Tidak Berlaku jika pertandingan tidak selesai dimainkan (kecuali jika hasil taruhan telah dapat ditentukan).\n\n15.16 Premier League Specials: (a) To Reach/Not to Reach the Final/Semi Final – Pemain harus setidaknya mengikuti satu pertandingan liga agar taruhan dinyatakan Berlaku. (b) To Be Relegated – Mengikuti periode minggu pertandingan, dua pemain terbawah di klasemen liga (yang kemudian gugur dari kompetisi), akan dianggap sebagai pemenang untuk tujuan penyelesaian taruhan. (c) Pemenang Musim Reguler - Untuk tujuan penyelesaian taruhan, pasar ini mengacu kepada pemain yang menempati posisi teratas klasemen liga setelah pertandingan babak grup sebelum play off.\n\n15.17 9-Dart Specials: (a) Apakah Pemain yang Dipilih akan Mencetak 9 Dart Finish dalam Pertandingan – Semua taruhan akan dinyatakan Tidak Berlaku jika pertandingan tidak diselesaikan kecuali 9 Dart Finish telah dihasilkan. (b) Apakah Pemain yang Dipilih akan Mencetak 9 Dart Finish dalam Turnamen – Pemain harus melempar setidaknya 1 anak panah dalam turnamen agar taruhan dinyatakan Berlaku. (c) Apakah akan ada 9 Dart Finish dalam Turnamen – Turnamen harus selesai dimainkan agar taruhan dinyatakan berlaku kecuali 9 Dart Finish telah dihasilkan. Taruhan akan tetap berlaku walaupun pemain menarik diri.\n\n15.18 Taruhan Berjalan ("Live"): (a) Taruhan pada pertandingan yang ditinggalkan sebelum jumlah leg/set yang ditentukan selesai akan dinyatakan Tidak Berlaku, kecuali jika hasil taruhan telah dapat ditentukan ketika pertandingan ditinggalkan. Misalnya, Poin Total Leg atau Total 180 telah dilewati ketika pertandingan ditinggalkan.\n\n15.19 Sistem skoring yang berlaku untuk taruhan Dart adalah Tipe Skoring B.` },
      { id: 's16', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA SELAM', content: `16.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Selam:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam suatu perlombaan. (B) Jika salah satu kompetitor tidak ambil bagian dalam perlombaan tersebut, taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's17', category: 'OLAHRAGA TERTENTU', title: 'E SPORTS', content: `17.1 Tanggal dan waktu mulai yang ditampilkan di situs untuk pertandingan E Sports bertujuan sebagai informasi saja dan tidak dijamin akan sesuai dengan jadwal sebenarnya. Semua taruhan akan dibatalkan jika semua pemain atau tim yang terdaftar tidak memulai dan menyelesaikan pertandingan sesuai dengan tanggal dan waktu yang telah dijadwalkan sebelumnya, dan syarat dan ketentuan yang ditetapkan pihak yang berwenang dalam mengeluarkan keputusan resmi seperti, panitia, penyelenggara atau badan resmi olahraga. Pengecualian diberikan kepada taruhan di pasar jenis apapun yang dimana hasil telah dapat ditentukan secara mutlak (contoh: First Blood)\n\n17.2 Semua taruhan yang telah dikonfirmasi akan dikembalikan jika pertandingan dibatalkan, diberhentikan, atau diundur, dan tidak dilanjutkan kembali dalam kurun 12 jam untuk pertandingan LAN dan 8 jam untuk pertandingan ONLINE dari jadwal bermain (lama waktu yang diperbolehkan berhak ditentukan atas pertimbangan Operator untuk pertandingan tertentu manapun). Pengecualian diberikan kepada taruhan dimana hasil telah dapat ditentukan secara mutlak sebelum terjadinya gangguan dalam pertandingan.\n\n17.3 Jika terdapat kesalahan penulisan nama pemain atau tim, maka semua taruhan akan tetap berlaku, kecuali jika secara jelas dan meyakinkan bahwa yang bersangkutan adalah peserta yang berbeda. Apabila pada suatu pertandingan resmi, peserta bermain menggunakan nickname yang salah atau dengan akun samaran, hasil pertandingan tersebut akan tetap dianggap sah. Jika terdapat bukti bahwa peserta adalah bukan pemain (atau salah satu dari para pemain) yang seharusnya bermain pada pertandingan tersebut dan badan resmi penyelenggara olahraga terkait tidak mengeluarkan pernyataan bahwa adanya pergantian pemain (atau beberapa pemain) yang akan mewakili klub/tim e-sports yang bersangkutan, maka taruhan-taruhan pada pertandingan tersebut akan dinyatakan tidak berlaku dan modal taruhan dikembalikan.\n\n17.4 Semua taruhan akan dinyatakan tidak berlaku dan modal taruhan dikembalikan jika jumlah map atau putaran yang sebelumnya ditentukan tidak selesai atau diubah atau berbeda dengan yang ditawarkan di pasar taruhan.\n\n17.5 Dengan mengacu pada syarat dan ketentuan lainnya, semua taruhan akan diselesaikan berdasarkan hasil resmi atau statistik yang dipublikasikan oleh pihak resmi pertandingan, panitia, atau badan resmi olahraga.\n\n17.6 Pada pasar taruhan langsung, jika suatu map diulang permainannya karena hasil seri, jaringan terputus atau karena alasan lain yang sama, maka semua taruhan langsung pada map tersebut akan dianggap tidak berlaku dan modal taruhan dikembalikan. Pengulangan permainan untuk map tersebut akan dianggap sebagai permainan baru yang terpisah.\n\n17.7 (a) Berikut adalah taruhan-taruhan yang ditawarkan pada E Sports:\n(i) Taruhan Non Live: (A) Handicap Asia (B) Atas/Bawah (1) Prediksi nilai total untuk jenis statistik tertentu yang ditawarkan adalah di atas atau di bawah dari statistik akhir. Untuk keperluan perhitungan taruhan Atas/Bawah dalam peraturan ini, taruhan Over (Atas) mencakup kondisi dimana hasil statistik akhir memiliki nilai yang sama dengan statistik yang ditawarkan, dan taruhan Under (Bawah) akan dinyatakan kalah. (C) First Tower atau First Turret (1) Prediksi pemain atau tim yang pertama kali menghancurkan Tower atau Turret milik pemain atau tim lawan. (D) First Blood (1) Prediksi pemain atau tim yang menghasilkan first kill. (E) First Dragon (1) Prediksi pemain atau tim yang pertama kali membunuh Dragon. (F) First Roshan (1) Prediksi pemain atau tim yang pertama kali membunuh Roshan. (G) Taruhan Kombinasi (1) Taruhan tunggal yang memiliki kombinasi 2 tipe taruhan atau lebih yang ditawarkan oleh Operator berdasarkan ronde atau pertandingan dimana pemain atau tim yang dipilih harus memenangkan semua jenis taruhan dari kombinasi tersebut. (H) First Ten Kills (1) Prediksi pemain atau tim yang pertama kali mencapai 10 kill. (I) Money Line (J) Outright (K) Period Betting\n(ii) Taruhan Berjalan ("Live"): (A) Handicap Asia (B) Atas/Bawah (1) Prediksi nilai total untuk jenis statistik tertentu yang ditawarkan adalah di atas atau di bawah dari statistik akhir. Untuk keperluan perhitungan taruhan Atas/Bawah dalam peraturan ini, taruhan Over (Atas) mencakup kondisi dimana hasil statistik akhir memiliki nilai yang sama dengan statistik yang ditawarkan, dan taruhan Under (Bawah) akan dinyatakan kalah.\n(b) Sistem skoring yang berlaku untuk taruhan E Sports adalah Tipe Skoring B.\n\n17.8 Walau disebutkan berbeda (jika ada) dalam peraturan ini, waktu tambahan hanya akan dihitung jika pada akhir putaran atau pertandingan, pemain lawan atau tim memiliki skor yang sama sehingga mengakibatkan hasil seri dan hasil seri tidak termasuk dalam pilihan taruhan yang ditawarkan oleh Operator. Dalam kondisi ini, hasil yang akan dianggap berlaku dalam penentuan dan penyelesaian taruhan adalah hasil pada akhir waktu tambahan.\n\n17.9 Jika hasil akhir pertandingan (APABILA terjadi satu atau beberapa babak waktu tambahan, maka hasil dari babak waktu tambahan terakhir yang akan dianggap sebagai hasil final pertandingan) menunjukkan hasil seri, maka taruhan pada pasaran "game win type market" (atau Prediksi Pemenang, dimana hasil yang valid hanya jika salah satu tim menjadi pemenang) akan dibatalkan dan modal taruhan dikembalikan.\n\n17.10 Walau disebutkan berbeda (jika ada) dalam peraturan ini: (a) semua taruhan pada pertandingan tim 5 v 5 untuk DOTA2 dan League of Legends akan dinyatakan tidak berlaku dan modal taruhan dikembalikan jika pertandingan dimulai dengan formasi kurang dari 10 pemain; (b) semua taruhan pada pertandingan tim 6 v 6 untuk DOTA2 dan League of Legends akan dianggap tidak berlaku dan modal taruhan dikembalikan jika pertandingan dimulai dengan formasi kurang dari 12 pemain; (c) semua taruhan pada pertandingan DOTA2 dan League of Legends, termasuk, namun tidak terbatas pada, semua taruhan berdasarkan map dan rangkaian yang berkaitan dengan pertandingan itu, akan dinyatakan tidak berlaku dan modal taruhan dikembalikan jika seorang pemain atau tim mengalami putus koneksi selama putaran atau pertandingan manapun dan tidak dapat tersambung kembali untuk menyelesaikan sisa putaran atau pertandingan; dan (d) semua taruhan pada pertandingan Counter Strike Global Offensive, termasuk, namun tidak terbatas pada, semua taruhan berdasarkan map dan rangkaian yang berkaitan dengan pertandingan itu, akan dinyatakan tidak berlaku dan modal taruhan dikembalikan jika sedikitnya 5 putaran dari pertandingan dimainkan dengan formasi kurang dari 10 pemain.\n\n17.11 (a) Taruhan Any Kill untuk pertandingan DOTA 2 dan League of Legends akan dihitung berdasarkan informasi di papan skor (scoreboard) saat permainan berlangsung, ditampilkan di bagian atas layar. (b) Istilah "Seri / Rangkaian" yang digunakan dalam Peraturan E Sports ini berarti serangkaian pertandingan atau putaran.\n\n17.12 Dalam situasi dimana: (1) pertandingan tidak dimulai pada tanggal dan waktu yang telah dijadwalkan sebelumnya oleh pihak yang berwenang dalam mengeluarkan keputusan resmi seperti, panitia, penyelenggara atau badan resmi olahraga; atau (2) pertandingan dimulai namun kemudian diberhentikan; atau (3) pertandingan dimulai namun kemudian ditunda; atau (4) jumlah putaran atau map tidak selesai, Operator akan, meski telah disebutkan di Peraturan 17.1, 17.2 dan 17.4 di atas, diberi hak, melalui pertimbangan Operator dan berdasarkan kasus yang ada, untuk menerima keputusan yang dikeluarkan oleh pihak resmi pertandingan, panitia atau badan yang berwenang (termasuk namun tidak terbatas pada keputusan yang berkaitan dengan lolos tidaknya pemain atau tim yang berpartisipasi dalam suatu event Olahraga ke tahap berikutnya) atau pengumuman pemenang pertandingan atau tahapan manapun dalam pertandingan meski keputusan atau pengumuman dilakukan di saat setelah terjadinya diskualifikasi pemain atau tim sebelum atau setelah dimulainya pertandingan.` },
      { id: 's18', category: 'OLAHRAGA TERTENTU', title: 'KETANGKASAN BERKUDA', content: `18.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Ketangkasan Berkuda:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam suatu perlombaan. (B) Jika salah satu dari kompetitor yang dipasangkan tidak ambil bagian dalam perlombaan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's19', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA ANGGAR', content: `19.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Anggar:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam suatu perlombaan. (B) Jika salah satu dari kompetitor yang dipasangkan tidak ambil bagian dalam perlombaan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's20', category: 'OLAHRAGA TERTENTU', title: 'HOKI LAPANGAN', content: `20.1 Semua taruhan akan diselesaikan berdasarkan skor akhir setelah pertandingan selesai dimainkan (termasuk tambahan waktu) namun tidak termasuk babak tambahan dan adu penalti kecuali jika terdapat hal lain yang ditetapkan.\n\n20.2 Berikut adalah taruhan-taruhan yang ditawarkan pada Hoki Lapangan:\n(a) Taruhan Non Live: (i) Handicap Asia (ii) Ganjil/Genap (iii) Outright (iv) Atas/Bawah\n(b) Taruhan Berjalan ("Live"): (i) Handicap Asia (ii) Atas/Bawah\n(c) Sistem Skoring: Tipe Skoring A berlaku` },
      { id: 's21', category: 'OLAHRAGA TERTENTU', title: 'SEPAK BOLA', content: `21.1 Kecuali jika tidak dinyatakan pada Peraturan Pertaruhan Sepak Bola, semua taruhan akan diselesaikan berdasarkan waktu bermain yang reguler (termasuk waktu jeda yang diberikan oleh wasit) tidak termasuk babak tambahan dan adu penalti.\n\n21.2 Jika pertandingan dijadwalkan untuk bermain di luar dari waktu bermain yang reguler (misalnya Periode waktu bermain khusus pada berbagai turnamen atau pertandingan persahabatan) semua taruhan akan diselesaikan berdasarkan hasil pada akhir pertandingan sesuai dengan waktu yang dijadwalkan tersebut.\n\n21.3 Kecuali jika waktu bermain non reguler yang dengan jelas tertera pada situs sebelum semua pertandingan sepak bola berlangsung, maka semua taruhan yang diterima pada pertandingan tersebut dinyatakan TIDAK BERLAKU.\n\n21.4 Jika status atau hasil dari pertandingan yang diumumkan pada situs resmi sudah jelas salah, atau di mana pertandingan tidak diselesaikan dalam waktu bermain yang reguler, Operator akan berusaha sebaik mungkin untuk menentukan status dan hasil yang benar pada pertandingan tersebut. Jika pertandingan tidak diselesaikan dalam waktu bermain reguler yang dijadwalkan [waktu reguler diartikan sebagai total waktu bermain yang dijadwalkan termasuk waktu jeda yang diberikan oleh pihak resmi] permainan akan diselesaikan oleh Operator sebagai tidak selesai dimainkan. Pada kasus seperti ini, hanya pasaran di mana telah ditentukan tanpa syarat akan diselesaikan. Untuk semua pasaran lainnya, taruhan dinyatakan tidak berlaku dan modal taruhan akan dikembalikan kepada Pemain. Operator berhak menyelesaikan pertandingan tersebut berdasarkan peraturan tersebut dan keputusan Operator dianggap final.\n\n21.5 Berikut adalah taruhan-taruhan yang ditawarkan pada Sepak Bola. Taruhan Berjalan ("Live") akan ditawarkan secara terpisah di bagian "Live".\n(i) 1X2 (ii) Handicap Asia (iii) Clean Sheet (A) Untuk memprediksi apakah tim akan tetap dengan clean sheet dan tidak kebobolan gol pada pertandingan yang ditentukan. (misalnya Tim A mengalahkan Tim B 3-0, Tim A telah "mempertahankan clean sheet" karena mereka tidak kebobolan gol) (B) Jika pertandingan ditinggalkan, semua taruhan akan dikembalikan. (iv) Tebak Skor - Babak Pertama, Babak Kedua & Babak Penuh (A) Untuk memenangkan TEBAK SKOR, tim pilihan Anda (tuan rumah atau tamu) harus menang dengan hasil atau skor yang benar. (B) Untuk memenangkan TEBAK SKOR DI ATAS-5, tim pilihan Anda (tuan rumah atau tamu) harus menang dengan perbedaan sebanyak 5 gol atau lebih. (C) Untuk memenangkan AOS atau "skor lainnya", tim pilihan Anda (tuan rumah atau tamu) harus menang dengan hasil atau skor yang tidak disebutkan pada pasar yang disediakan. (v) Kesempatan Ganda (A) Bertaruh pada 2 dari 3 kemungkinan berdasarkan dari 3 pilihan yang tersedia (misalnya Tim Tuan Rumah Menang atau Seri (1X), Tim Tamu Menang atau Seri (X2), Tim Tuan Rumah Menang atau Tim Tamu Menang (12)). (B) Jika pertandingan dimainkan di lapangan netral, taruhan akan diselesaikan sesuai dengan lokasi pertandingan (Tim Tuan Rumah/Tim Tamu) yang ditampilkan pada situs kami. (vi) Pertandingan Fantasi (vii) Tendangan Sudut Pertama (A) Memprediksi tim yang menerima tendangan sudut pertama pada pertandingan yang ditentukan dalam waktu bermain yang regular. (B) Jika pertandingan ditinggalkan setelah tendangan sudut pertama diberikan, semua taruhan pada Tendangan Sudut Pertama akan tetap berlaku. (C) Jika pertandingan ditinggalkan sebelum tendangan sudut pertama diberikan, semua taruhan pada Tendangan Sudut Pertama akan dikembalikan. (viii) Gol Pertama / Gol Terakhir / Tidak ada Gol (A) Memprediksi Gol Pertama, Gol Terakhir atau Tidak ada Gol setelah kick-off pada pertandingan yang ditentukan dalam waktu bermain yang reguler. (B) Gol bunuh diri dihitung untuk tim yang mendapatkan gol (misalnya Tim A vs tim B, Tim B mencetak gol bunuh diri yang menyebabkan skor menjadi 1-0, gol pertama akan diberikan kepada Tim A). (C) Jika pertandingan ditinggalkan setelah sebuah gol tercetak, semua taruhan pada Gol Pertama dan Tidak Ada Gol akan tetap berlaku namun taruhan pada Gol Terakhir akan dikembalikan. (D) Jika pertandingan ditinggalkan tanpa adanya gol, semua taruhan pada Gol Pertama, Gol Terakhir dan Tidak ada Gol akan dikembalikan. (ix) Offside Pertama / Offside Terakhir (A) Memprediksi tim yang akan melakukan offside pertama/offside terakhir pada pertandingan yang ditentukan dalam waktu bermain yang reguler. (B) Jika pertandingan ditinggalkan setelah terjadinya offside pertama, semua taruhan pada Offside Pertama akan tetap berlaku, namun semua taruhan pada Offside Terakhir akan dikembalikan. (C) Jika pertandingan ditinggalkan sebelum adanya offside terjadi, semua taruhan pada Offside Pertama/Offside Terakhir akan dikembalikan. (x) Substitusi Pertama / Substitusi Terakhir (A) Memprediksi tim mana antara kedua tim yang akan melakukan substitusi pemain pertama/terakhir pada pertandingan yang ditentukan dalam waktu bermain yang reguler. (B) Pada situasi di mana terdapat lebih dari dua pemain yang disubstitusi pada saat yang bersamaan, nomor pemain yang ditunjukkan terlebih dahulu oleh pihak resmi ke-4 akan dianggap sebagai hasilnya. (C) Jika pertandingan ditinggalkan setelah substitusi pertama dilakukan, semua taruhan pada Substitusi Pertama akan tetap berlaku, namun semua taruhan pada Substitusi Terakhir akan dikembalikan. (D) Jika pertandingan ditinggalkan sebelum substitusi dilakukan, maka semua taruhan pada Substitusi Pertama/ Substitusi Terakhir akan dikembalikan. (xi) Kartu Kuning Pertama (A) Memprediksi pemain/tim mana yang akan menerima kartu kuning pertama pada pertandingan yang ditentukan dalam waktu permainan reguler. (B) Jika terjadi pemberian kartu merah langsung (pelanggaran profesional), maka booking tersebut akan dianggap sebagai kartu merah dan bukan kartu kuning. (C) Dalam hal terdapat dua pemain atau lebih menerima kartu kuning dalam kejadian yang sama, maka pemain yang mendapat kartu kuning pertama oleh wasit akan dianggap sebagai hasilnya. (D) Kartu kuning yang diberikan kepada non-pemain (misalnya pemain pengganti/cadangan, manajer atau pelatih) tidak akan dihitung. (E) Jika pertandingan ditinggalkan setelah kartu kuning pertama diberikan, semua taruhan pada Kartu Kuning Pertama akan tetap berlaku. (xii) Pencetak Gol (A) Memprediksi pencetak gol dalam pertandingan yang ditentukan. (B) Taruhan akan dikembalikan jika pemain yang dipilih tidak bermain dalam pertandingan. (C) Taruhan akan tetap berlaku jika pemain yang dipilih diturunkan ke lapangan setiap saat selama waktu bermain yang regular. (D) Gol bunuh diri dan gol yang dicetak dalam Adu Penalti tidak dihitung. (xiii) Tendangan Sudut Terakhir (A) Memprediksi tim mana yang akan menerima tendangan sudut terakhir pada pertandingan yang ditentukan dalam waktu bermain yang reguler. (B) Jika pertandingan ditinggalkan dalam waktu bermain reguler, semua taruhan pada Tendangan Sudut Terakhir akan dikembalikan. (xiv) Ganjil/Genap (xv) Outright (A) Pencetak Gol Terbanyak (1) Perhitungan gol yang dicetak harus berada dalam liga atau turnamen yang sama. (2) Gol bunuh diri tidak akan dihitung. (xvi) Atas/Bawah (xvii) Tendangan Penalti (A) Handicap (1) Hasil penalti untuk pasaran Handicap juga termasuk sudden death. (B) Atas/Bawah (1) Hasil penalti untuk pasaran Atas/Bawah tidak termasuk sudden death dan adalah berdasarkan pada 5 tendangan penalti untuk masing-masing tim. (xviii) Penalti yang dilakukan (A) Memprediksi penalti yang diberikan dan dilakukan pada pertandingan yang ditentukan dalam waktu bermain yang reguler. (B) Jika pertandingan ditinggalkan setelah penalti diberikan dan dilakukan, semua taruhan akan tetap berlaku. (C) Jika pertandingan ditinggalkan sebelum penalti diberikan dan dilakukan, semua taruhan akan dikembalikan. (xix) Period Betting - Untuk Event 10 dan 15 menit (A) Taruhan pada Event 10 dan 15 menit diputuskan oleh jumlah total tindakan (misalnya: gol, tendangan sudut dan booking) dalam pertandingan dengan jangka waktu 10 atau 15 menit selama pertandingan berlangsung (misalnya 00:00-15:00; 15:01-30:00) (B) Waktu dari setiap tindakan akan ditentukan dengan mengikuti waktu pertandingan resmi. (C) Taruhan dengan status menunggu yang melebihi periode taruhan tertentu akan ditolak dan dikembalikan. (D) Tindakan yang dilakukan kembali tidak dihitung. (E) Peraturan pada Total Jumlah Bookings (Peraturan Pertaruhan Olahraga Tertentu xxi) akan berlaku. (xx) Total Gol – Babak Pertama & Babak Penuh (A) Taruhan Total Gol melibatkan prediksi pada jumlah gol atau poin yang dicetak pada suatu pertandingan di mana taruhan tersebut ditempatkan. (xxi) Total Jumlah Booking (A) Hasil Total Booking akan diputuskan oleh jumlah booking yang dihasilkan baik oleh Tim Tuan Rumah maupun Tim Tamu atau kedua Tim tersebut (termasuk handicap, jika ada). (B) Booking pada non-pemain (misalnya pemain pengganti/cadangan, pemain terganti yang tidak lagi memainkan sisa pertandingan, manajer atau pelatih) tidak akan dihitung ke dalam jumlah total. Namun booking yang diberikan kepada pemain pengganti/cadangan ketika masih menjadi non-pemain akan diakumulasikan setelah pemain pengganti/cadangan tersebut diikutsertakan ke dalam pertandingan. (C) Poin booking dihitung sebagai: (i) 1 kartu kuning = 1 poin (ii) 1 kartu merah = 2 poin (D) Jumlah poin maksimum dihitung per pemain adalah 3 poin; 1 poin untuk kartu kuning pertama dan 2 poin untuk kartu merah, kartu kuning kedua tidak akan dihitung. (E) Jika pertandingan ditinggalkan dalam waktu bermain reguler, semua taruhan pada Total Booking akan dikembalikan kecuali hasil taruhan telah dapat ditentukan. (F) Hasil Total Booking untuk Babak Pertama akan diputuskan begitu pihak resmi meniupkan peluit untuk mengakhiri Babak Pertama. Adanya booking yang dibuat antara waktu pihak resmi pertandingan meniupkan peluit untuk mengakhiri Babak Pertama dan dimulainya Babak kedua akan diakumulasikan ke hasil Total Booking untuk Babak Penuh. (G) Hasil Total Booking untuk Babak Penuh akan berdasarkan jumlah booking yang diakumulasikan hingga peluit babak penuh ditiupkan. Adanya booking yang dibuat setelah peluit babak penuh ditiupkan akan diabaikan. (xxii) Total Jumlah Tendangan Sudut (A) Hasil Jumlah Tendangan Sudut ditentukan oleh total jumlah Tendangan Sudut dari Tim Tuan Rumah, Tim Tamu atau Kedua Tim Tuan Rumah dan Tamu dalam pertandingan yang ditentukan (termasuk handicap, jika ada). (B) Tendangan sudut yang dilakukan kembali akan dihitung sebagai satu. (C) Tendangan sudut yang diberikan namun tidak dilakukan tidak akan dihitung. (D) Semua taruhan Total Jumlah Tendangan Sudut pada Handicap Asia dan Atas/Bawah yang berada pada status Menunggu, akan dibatalkan jika salah satu dari berikut ini terjadi: (i) satu gol dihasilkan; atau (ii) seorang pemain dikeluarkan. (xxiii) Total Jumlah Substitusi (A) Hasil Total Jumlah Substitusi ditentukan oleh total jumlah substitusi dari Tim Tuan Rumah/Tim Tamu yang dilakukan dalam pertandingan yang ditentukan. (B) Jika pertandingan ditinggalkan dalam waktu bermain yang reguler, semua taruhan pada Total Jumlah Substitusi akan dikembalikan. (xxiv) Total Jumlah Offside (A) Penyelesaian taruhan pada Total Offside akan dilakukan untuk pertandingan yang ditentukan dalam waktu bermain yang reguler. (B) Jika pertandingan ditinggalkan dalam waktu bermain yang reguler, semua taruhan pada Total Offside akan dikembalikan. (xxv) Total Tim Tuan Rumah vs. Total Tim Tamu – Babak Pertama & Babak Penuh (A) Total Tim Tuan Rumah vs Total Tim Tamu diputuskan oleh total jumlah gol yang dicetak oleh tim tuan rumah terhadap total jumlah gol yang dicetak oleh tim tamu pada liga yang ditawarkan untuk bertaruh. (B) Tim Tuan Rumah mengacu kepada tim pertama yang tertera pada situs kami. Tim Tamu mengacu kepada tim kedua yang tertera pada situs kami. (xxvi) Total Gol Tim (A) Total Gol Tim diputuskan oleh jumlah gol yang dicetak oleh suatu tim pada sebuah pertandingan, misalnya Jumlah Gol Tim West Ham – (Atas), atau Jumlah Gol Tim West Ham – (Bawah). (xxvii) Next Action (Gol, Tendangan Sudut atau Booking) - Taruhan ini mengharuskan Anda untuk memprediksi tim mana yang akan diberikan tindakan selanjutnya dalam pertandingan tersebut (Gol, Tendangan Sudut atau Booking). Jika tidak ada tindakan yang diberikan, semua taruhan akan dikembalikan. (xxviii) Kartu Kuning (A) Hanya kartu kuning yang dihitung. Jika pemain menerima kartu Merah dari dua (2) pelanggaran kartu Kuning, pemain akan dihitung mendapatkan satu kartu kuning dan satu kartu merah. Kartu kuning kedua akan diabaikan untuk tujuan penyelesaian taruhan. (B) Hasil Kartu Kuning ditentukan dari jumlah kartu kuning yang dihasilkan baik oleh Tim Tuan Rumah, Tim Tamu atau kedua Tim tersebut (termasuk handicap, jika ada). (C) Kartu kuning yang diberikan kepada non-pemain (misalnya pemain pengganti/cadangan, pemain terganti yang tidak lagi memainkan sisa pertandingan, manajer atau pelatih) tidak akan dihitung ke dalam jumlah total. Namun kartu kuning yang diberikan kepada pemain pengganti/cadangan ketika masih menjadi non-pemain akan diakumulasikan setelah pemain pengganti/cadangan tersebut diikutsertakan ke dalam pertandingan. (D) Jika pertandingan ditinggalkan dalam waktu bermain reguler, semua taruhan pada Kartu Kuning akan dikembalikan kecuali hasil taruhan telah dapat ditentukan. (E) Hasil Kartu Kuning untuk Babak Pertama akan ditentukan setelah wasit meniup peluit untuk mengakhiri Babak Pertama. Setiap kartu kuning yang diberikan antara waktu berakhirnya Babak Pertama dengan waktu dimulainya Babak Kedua akan diakumulasikan ke hasil Kartu Kuning untuk Babak Penuh. (F) Hasil Kartu Kuning untuk Babak Penuh akan ditentukan dari jumlah kartu kuning yang diakumulasikan sampai peluit tanda Babak Penuh berakhir ditiupkan. Semua kartu kuning yang diberikan setelah babak penuh berakhir akan diabaikan. (xxix) Tendangan ke Gawang (Pertandingan / Tim / Pemain Terpilih) (A) Tendangan ke Gawang (Shots on Goal): (1) Hasil Tendangan ke Gawang ditentukan oleh jumlah Tendangan ke Gawang yang dihasilkan baik oleh Tim Tuan Rumah, Tim Tamu atau kedua Tim tersebut. (2) Tendangan ke Gawang adalah setiap upaya mencetak gol yang: (a) menghasilkan gol; atau (b) dapat menghasilkan gol tetapi dihentikan oleh kiper atau diblok pemain lawan; atau (c) mengarah ke gawang tetapi diblok oleh pemain lawan, dimana ada pemain lain atau kiper di belakang pemblokir tersebut; atau (d) keluar atau melewati gawang tanpa adanya kontak dengan pemain mana pun; atau (e) dapat keluar atau melewati gawang tetapi dihentikan oleh kiper atau diblok pemain lawan. (3) Tembakan yang mengenai kerangka gawang dianggap Tendangan ke Gawang. (4) Jika pertandingan ditinggalkan sebelum peluit tanda berakhir ditiupkan, semua taruhan akan dinyatakan tidak berlaku kecuali hasil taruhan telah dapat ditentukan. (B) Tendangan Tepat Sasaran (Shots on Target): (1) Hasil Tendangan Tepat Sasaran ditentukan oleh jumlah Tendangan Tepat Sasaran yang dihasilkan baik oleh Tim Tuan Rumah, Tim Tamu atau kedua Tim tersebut. (2) Tendangan Tepat Sasaran adalah setiap upaya mencetak gol yang menghasilkan gol; atau dapat menghasilkan gol tetapi dihentikan oleh kiper atau diblok pemain lawan. (3) Tembakan yang mengenai kerangka gawang tidak akan dianggap Tendangan Tepat Sasaran kecuali memenuhi persyaratan di atas. (4) Jika pertandingan ditinggalkan sebelum peluit tanda berakhir ditiupkan, semua taruhan akan dinyatakan tidak berlaku kecuali hasil taruhan telah dapat ditentukan. (xxx) Statistik Lainnya (Pertandingan / Tim / Pemain) - Statistik yang disediakan oleh penyedia skor resmi atau situs resmi dari kompetisi atau pertandingan terkait akan digunakan untuk menyelesaikan taruhan. Jika statistik dari penyedia skor resmi atau situs resmi tidak tersedia atau terdapat bukti bahwa hasil penyedia skor resmi atau situs resmi tidak benar, bukti independen akan digunakan untuk mendukung penyelesaian taruhan. Apabila tidak ada bukti yang konsisten dan independen atau adanya konflik bukti yang signifikan, taruhan akan diselesaikan berdasarkan statistik Operator sendiri. (A) Pelanggaran: (1) Pelanggaran adalah aksi curang yang dilakukan oleh pemain di lapangan pertandingan dan dianggap oleh wasit sebagai tindakan yang melanggar peraturan pertandingan, membahayakan keselamatan pemain lain, atau menganggu jalannya pertandingan. Tim yang membuat pelanggaran akan dihukum dengan diberikannya tendangan bebas atau tendangan pinalti kepada tim lawan. (B) Lemparan ke Dalam (Throw-Ins): (1) Lemparan ke Dalam yang diberikan namun tidak dilakukan tidak akan dihitung. (2) Lemparan ke Dalam yang dilakukan ulang karena instruksi wasit hanya akan dihitung satu. (C) Offside: (1) Diberikan ketika pemain dianggap berada dalam posisi offside. Tendangan bebas akan diberikan. (D) Tekel (Tackle): (1) Tekel didefinisikan sebagai kondisi ketika pemain berhasil mengambil bola dari kaki pemain lawan sambil meluncur ke arah bola. (2) Pemain yang terkena tekel harus dengan jelas menguasai bola sebelum terkena tekel. (xxxi) Kedua Tim Mencetak Gol - Babak Pertama, Babak Kedua & Babak Penuh (A) Taruhan dipasang pada apakah kedua tim akan mencetak gol selama periode pertandingan tertentu. (xxxii) Tim dengan Jumlah Tendangan Sudut Terbanyak (A) Taruhan dipasang pada tim yang mendapatkan jumlah tendangan sudut terbanyak yang diakumulasi di akhir waktu bermain yang regular. (xxxiii) Pencetak Dua Gol atau Lebih (A) Taruhan dipasang pada pemain tertentu yang mencetak dua gol atau lebih dalam sebuah pertandingan. (B) Sebagai contoh ketika Pemain A mencetak dua gol atau lebih atau Pemain B mencetak dua gol atau lebih. (xxxiv) Pencetak Tiga Gol atau Lebih (Hat Trick) (A) Taruhan dipasang pada pemain tertentu yang mencetak tiga gol atau lebih dalam sebuah pertandingan. (B) Sebagai contoh ketika Pemain A mencetak tiga gol atau lebih atau Pemain B mencetak tiga gol atau lebih.\n\n21.6 Tipe Skoring A berlaku untuk produk berikut yang ditawarkan untuk taruhan langsung: (a) 1X2 (b) Handicap Asia (c) Ganjil/Genap (d) Atas/Bawah (e) Total Jumlah Tendangan Sudut (f) Total Jumlah Booking (g) Kartu Kuning (h) Tendangan ke Gawang (i) Statistik Lainnya\n\n21.7 Tipe Skoring B berlaku untuk produk berikut yang ditawarkan untuk taruhan langsung: (a) Pemenang Pertandingan (Match Winner) (b) Tim mana yang memenuhi syarat (Which team to qualify)\n\n21.8 Taruhan e-Football: (a) Kecuali jika dinyatakan pada Peraturan 21.8, maka Peraturan 21 yang akan berlaku. (b) e-Football adalah pertandingan yang disimulasi berdasarkan Kecerdasaran Buatan (Artificial Intelligence), Pembelajaran Mesin (Machine Learning) dan riwayat database sepak bola untuk mencerminkan bentuk tim dan permainan pertandingan. (c) Setiap pertandingan dimainkan dalam dua babak masing-masing 8 menit dan total waktu pertandingan adalah 16 menit. (d) Hasil pertandingan e-Football, skor dan data penentu taruhan lainnya dihasilkan oleh perangkat lunak dan tidak tersedia sumber lain, termasuk dari tim resmi atau situs liga pertandingan. (e) e-Football adalah pertandingan yang disiarkan dan termasuk pertandingan Taruhan Umum, para Pengguna Akhir dapat bertaruh pada pertandingan tertentu. Hasil pada pertandingan tersebut akan menentukan perhitungan dari taruhan yang ditempatkan oleh semua Pengguna Akhir. (f) Apabila suatu pertandingan tidak selesai dalam waktu yang dijadwalkan karena kesalahan teknis apapun, termasuk bukan hanya kesalahan komputer, elektronik, perangkat lunak, perangkat keras ataupun koneksi, pertandingan akan diselesaikan dengan status pertandingan tidak selesai dimainkan. Dalam hal ini taruhan yang diselesaikan hanya taruhan yang telah ditentukan tanpa syarat. Untuk pasar lainnya dan terlepas dari hasil indikatif apa pun, taruhan akan dinyatakan tidak berlaku dan modal taruhan akan dikembalikan ke Pengguna Akhir. Operator akan menyelesaikan pertandingan tersebut sesuai dengan aturan ini dan keputusan Operator akan dianggap final. (g) Operator berhak menyatakan sebuah taruhan e-Football tidak berlaku apabila; (i) sebagian atau perincian taruhan yang tidak tepat; (ii) Pengguna Akhir dicurigai berpartisipasi dalam penipuan, kolusi, pencucian uang atau kegiatan ilegal lainnya; (iii) pertandingan tidak dimainkan atau tidak selesai atau hasil pertandingan tidak dapat ditentukan; (iv) penerimaan taruhan akan melampaui batas maksimum bertaruh; (v) jumlah kredit taruhan tidak tersedia di akun pemain; (vi) terjadi kesalahan (manusia atau lainnya) atau kegagalan sistem yang mengakibatkan odds yang ditawarkan tidak tepat; (vii) kesalahan teknis seperti kegagalan komunikasi, kecacatan, gangguan, keterlambatan, virus, penolakan layanan, atau data rusak; atau (viii) jika terjadi kesalahan teknis yang menghasilkan pembayaran yang tidak wajar. (h) Apabila terjadi kesalahan (manusia atau lainnya) atau kegagalan sistem saat perhitungan taruhan, penyelesaian akan dianggap tidak valid dan diperbaiki sebagaimana mestinya. Apabila Pengguna Akhir tidak memiliki kredit yang mencukupi di dalam akun, maka dalam kondisi ini, Pengguna Akhir akan diminta untuk mengembalikan jumlah dana yang diperlukan kepada Operator.` },
      { id: 's22', category: 'OLAHRAGA TERTENTU', title: 'FUTSAL', content: `22.1 Peraturan 12 Jam tidak berlaku untuk taruhan Futsal.\n\n22.2 Semua taruhan akan diselesaikan berdasarkan waktu reguler (sesuai dengan badan pengatur kompetisi), kecuali dinyatakan berbeda, apabila tidak ada skor maka taruhan Ganjil/Genap akan diselesaikan sebagai Genap. Waktu reguler harus diselesaikan agar taruhan berlaku kecuali jika hasil dari pasaran tertentu telah dapat ditentukan.\n\n22.3 Taruhan In-Play/Live berikut akan diselesaikan pada akhir babak tambahan/penalti: To Qualify / Lift Trophy / Win Shoot-out.\n\n22.4 Taruhan Paruh Babak akan diselesaikan pada akhir babak yang ditentukan (tidak termasuk babak tambahan (jika ada)). Jika babak tertentu tidak diselesaikan, taruhan akan dinyatakan tidak berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan.\n\n22.5 Berikut adalah taruhan-taruhan yang ditawarkan pada Futsal:\n(a) Taruhan Non Live: (i) 1x2 (ii) Asian Handicap (iii) Kesempatan Ganda (iv) Ganjil/Genap (v) Outright (vi) Atas/Bawah (vii) Taruhan Berperiode/Paruh Babak\n(b) Taruhan Berjalan ("Live")\n\n22.6 Sistem Skoring: Tipe Skoring B berlaku.` },
      { id: 's23', category: 'OLAHRAGA TERTENTU', title: 'SEPAK BOLA GAELIC', content: `23.1 Kecuali jika tidak dinyatakan pada pasaran tertentu, semua taruhan akan diselesaikan berdasarkan waktu bermain yang regular 60 atau 70 menit (termasuk tambahan waktu yang diberikan oleh wasit) namun tidak termasuk babak tambahan atau adu penalti.\n\n23.2 Total poin yang dicetak oleh masing-masing tim akan digunakan untuk menentukan apakah taruhan tersebut adalah pemenang pada akhir pertandingan. Total skor yang diberikan kepada suatu tim adalah total poin dari gol dan poin yang dicetak. 1 goal adalah sama dengan 3 poin.\n\n23.3 Berikut adalah taruhan-taruhan yang ditawarkan pada Sepak Bola Gaelic:\n(a) Taruhan Non Live: (i) 1X2 (ii) Handicap Asia (iii) Babak 1/ Babak Penuh (iv) Highest Scoring Half (A) Taruhan pada Highest Scoring Half adalah ditentukan oleh total skor yang diakumulasikan selama Babak Pertama terhadap total skor yang diakumulasikan selama Babak Kedua pada pertandingan yang ditawarkan untuk taruhan. Gol atau poin yang dicetak pada babak tambahan dikecualikan dalam penentuan pemenang. (B) Jika terdapat salah satu kompetitor tidak ikut serta dalam pertandingan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (v) Ganjil/Genap (vi) Outright (vii) Atas/Bawah (viii) Period Betting (ix) Total Gol (A) Taruhan Total Gol melibatkan prediksi total jumlah gol yang dicetak pada suatu pertandingan di mana taruhan tersebut ditempatkan. Gol yang dicetak pada babak tambahan akan dikecualikan.` },
      { id: 's24', category: 'OLAHRAGA TERTENTU', title: 'GOLF', content: `24.1 Perubahan Tanggal/Tempat: Peraturan 12 Jam tidak berlaku pada taruhan Golf. Jika turnamen ditunda, dijadwalkan kembali, atau dipindahkan ke lapangan yang berbeda, semua taruhan akan tetap berlaku. Setiap penundaan yang diakibatkan oleh cuaca akan tetap berlaku kecuali jika keseluruhan turnamen tidak selesai. Jika terjadi penundaan atau penangguhan, peraturan turnamen bersifat final. Operator akan mengikuti semua hasil dari pihak resmi turnamen.\n\n24.2 Stableford / Format Pertandingan: Operator berhak untuk membatalkan taruhan apabila terdapat kesalahan pasaran yang ditawarkan pada pertandingan yang bukan merupakan format stroke play.\n\n24.3 Penyelesaian Taruhan: Kecuali jika dinyatakan berbeda, taruhan akan diselesaikan sesuai dengan hasil resmi dari pihak penyelenggara. Pengumuman di podium, penyerahan medali, dan lainnya akan dianggap sebagai hasil resmi. Jika terdapat keraguan atas suatu hasil, Operator akan merujuk pada informasi yang masuk akal dan bukti yang tersedia secara umum untuk menentukan hasil resmi. Operator berhak untuk melakukan perubahan penyelesaian taruhan jika terdapat kesalahan pada penyelesaian sebelumnya. Jika tidak terdapat harga khusus yang ditawarkan pada hasil Seri atau Tie, peraturan Dead heat akan berlaku. Kecuali jika dinyatakan berbeda, apabila suatu pertandingan tidak diselesaikan karena alasan apa pun, taruhan akan dibatalkan kecuali yang telah ditentukan tanpa syarat.\n\n24.4 Peraturan Dead Heat: Apabila terdapat dua peserta atau lebih selesai dalam posisi seri, taruhan dibagi berdasarkan jumlah peserta.\n\n24.5 Kesalahan: Apabila taruhan diterima secara keliru setelah pertandingan dimulai, atau setelah hasilnya diketahui, Operator berhak untuk menyelesaikan taruhan sebagai tidak berlaku. Apabila pemain dan/atau informasi pertandingan ditampilkan dengan tidak benar, Operator berhak untuk mengoreksi atau menyelesaikan taruhan sebagai tidak berlaku.\n\n24.6 Ante Post: Taruhan Ante-Post tersedia "All in, Run atau Not" berarti bahwa taruhan akan diselesaikan kalah apabila pilihan gagal dalam mengambil posisi apapun. Operator dapat menentukan bahwa suatu pasaran adalah "Non-Runner, No Bet". Artinya modal akan dikembalikan pada pilihan yang tidak mengambil posisi apapun.\n\n24.7 Berikut adalah taruhan-taruhan yang ditawarkan pada Golf:\n(a.1) Taruhan Handicap Stroke: Handicap diterapkan pada Skor Ronde pemain yang ditentukan, dengan skor terendah sebagai pemenangnya. Misalnya Pemain A -1.5 mendapat skor 70, Pemain B +1.5 mendapat skor 71, maka Pemain B ditetapkan sebagai pemenang setelah mendapatkan handicap. Dalam taruhan Handicap 18 Hole jika pemain mengundurkan diri sebelum menyelesaikan hole ke-18, maka semua taruhan akan dibatalkan. Jika pemain didiskualifikasi karena alasan apa pun, maka taruhan pada pemain tersebut akan dinyatakan kalah.\n(a.2) Match Up Tournament (Head to Head Tee Off): Jika pemain menarik diri sebelum event dimulai, taruhan dinyatakan TIDAK BERLAKU. Jika turnamen diselesaikan lebih awal atau tidak diselesaikan karena cuaca buruk atau lainnya, maka taruhan akan diselesaikan dengan ketentuan jika terdapat pengumuman pemenang dari turnamen dan setidaknya 36 holes telah diselesaikan. Pemenangnya adalah pemain yang memimpin pada akhir putaran terakhir yang diselesaikan. Jika salah satu pemain miss the cut, maka pemain lainnya dianggap sebagai pemenang. Jika kedua pemain miss the cut, maka skor terendah (dan/atau skor poin tertinggi, untuk turnamen yang menggunakan sistem penilaian Stableford) setelah cut dilakukan akan digunakan untuk penyelesaian taruhan. Jika pemain didiskualifikasi atau menarik diri setelah mulai, maka pemain lainnya dianggap sebagai pemenang dengan catatan setidaknya 36 holes telah diselesaikan. Jika pemain didiskualifikasi pada ronde ke-3 atau ke-4, ketika pemain lain dalam taruhan pertandingan telah miss the cut, maka pemain yang didiskualifikasi tersebut dianggap sebagai pemenang. Jika kedua pemain memiliki skor yang sama persis pada akhir pertandingan, semua taruhan akan dinyatakan TIDAK BERLAKU.\n(b) Pertukaran Taruhan: Taruhan 18 Hole - Pemain vs. Pemain (Pertandingan handicap akan ditentukan berdasarkan jumlah pukulan yang diberikan, skor bersih akan menentukan hasil pertandingan.) Kedua pemain harus melakukan tee off agar taruhan dapat berlaku. Pertandingan 18 hole didasarkan pada satu ronde. (Playoff tidak termasuk).\n(c) Taruhan 3Ball / Taruhan 3 Bola: Ketiga pemain harus melakukan tee off agar taruhan dapat berlaku. Pertandingan 18 hole didasarkan pada satu ronde. (Playoff tidak termasuk). Apabila satu atau lebih pemain tidak menyelesaikan 18 holes, semua taruhan akan dinyatakan tidak berlaku. Peraturan Dead Heat berlaku. Jumlah kemenangan akan dibagi dengan jumlah pemain yang Tie. Untuk turnamen yang menggunakan sistem penilaian Stableford, pencetak poin tertinggi selama ronde dianggap sebagai pemenang. Taruhan akan tetap berlaku terlepas dari diskualifikasi atau penalti berikutnya setelah 18 hole diselesaikan.\n(d) Taruhan Birdie Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Apabila pemain belum menyelesaikan jumlah hole yang ditentukan maka taruhan akan diselesaikan berdasarkan taruhan yang telah ditentukan tanpa syarat atau tidak. Jumlah total Birdie pada kartu skor pemain untuk ronde tertentu. Hanya Birdie yang dihitung. Setiap hole dengan skor 'Birdie' dihitung sebagai 1. Semua ketentuan diatas hanya untuk ronde tunggal.\n(e) Taruhan Par Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Apabila pemain belum menyelesaikan jumlah hole yang ditentukan maka taruhan akan diselesaikan berdasarkan taruhan yang telah ditentukan tanpa syarat atau tidak. Jumlah total Par pada kartu skor pemain untuk ronde tertentu. Hanya Par yang dihitung. Setiap hole dengan skor 'Par' dihitung sebagai 1. Semua ketentuan diatas hanya untuk ronde tunggal.\n(f) Taruhan Bogey Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Apabila pemain belum menyelesaikan jumlah hole yang ditentukan maka taruhan akan diselesaikan berdasarkan taruhan yang telah ditentukan tanpa syarat atau tidak. Jumlah total Bogey pada kartu skor pemain untuk ronde tertentu. Hanya Bogey yang dihitung. Setiap hole dengan skor 'Bogey' dihitung sebagai 1. Semua ketentuan diatas hanya untuk ronde tunggal.\n(g) Taruhan Double Bogey + Eagle Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Apabila pemain belum menyelesaikan jumlah hole yang ditentukan maka taruhan akan diselesaikan berdasarkan taruhan yang telah ditentukan tanpa syarat atau tidak. Jumlah total DB + Eagle pada kartu skor pemain untuk ronde yang disebutkan. Harap diperhatikan bahwa "DB + Eagle" berhubungan dengan skor apa pun yang berupa Double Bogey (+2) atau Eagle (-2). Setiap hole dengan salah satu skor ini dihitung sebagai 1. Semua ketentuan diatas hanya untuk ronde tunggal.\n(h) Taruhan "Birdie + Bogey" Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Apabila pemain belum menyelesaikan jumlah hole yang ditentukan maka taruhan akan diselesaikan berdasarkan taruhan yang telah ditentukan tanpa syarat atau tidak. Jumlah total Birdie + Bogey pada kartu skor pemain untuk ronde tertentu. Hanya Birdie + Bogie yang dihitung. Tiap hole dengan skor "Bogey" dihitung 1. Tiap Hole dengan skor "Birdie" dihitung 1. Semua ketentuan diatas hanya untuk ronde tunggal.\n(i) Taruhan Total Skor - Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Dalam taruhan Total Skor Atas/Bawah 18 Hole jika pemain mengundurkan diri sebelum menyelesaikan hole ke-18, semua taruhan akan dibatalkan. Dalam taruhan Total Skor 1-9 Hole - Atas/Bawah jika pemain mengundurkan diri sebelum menyelesaikan 9 hole yang ditentukan, semua taruhan akan dibatalkan. Dalam taruhan Total Skor 10-18 Hole - Atas/Bawah jika pemain mengundurkan diri sebelum menyelesaikan 9 hole yang ditentukan, semua taruhan akan dibatalkan. Untuk taruhan Total Skor 1-9 dan 10-18 Hole - Atas/Bawah, angka-angka tersebut menunjukkan nomor hole sebenarnya di lapangan golf dan bukan hole yang pernah dimainkan oleh pemain. Taruhan pada pasar Total Skor 1-9 dan 10-18 Hole - Atas/Bawah akan berlaku jika pemain menyelesaikan jumlah hole yang ditentukan meskipun pemain tidak menyelesaikan 18 hole penuh. Semua ketentuan diatas hanya untuk ronde tunggal.\n(j) Taruhan Birdie/Bogey Pertama: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Jika tidak ada pemain yang mencetak Birdie atau Bogey, semua taruhan akan dikembalikan. Apabila kedua pemain mencetak birdie atau bogey pertama pada hole yang sama, semua taruhan akan dinyatakan tidak berlaku terlepas dari pemain mana yang menyelesaikan keseluruhan terlebih dahulu. Taruhan dianggap berlaku terlepas dari hole mana pemain memulai rondenya karena pertandingan diperuntukkan bagi pemain dalam grup yang sama. Semua ketentuan diatas hanya untuk ronde tunggal.\n(k) Taruhan "Greens in Regulation" Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Pada taruhan 18 Hole Atas/Bawah jika ada pemain yang mengundurkan diri sebelum menyelesaikan taruhan hole ke-18, taruhan akan dibatalkan kecuali taruhan yang telah ditentukan tanpa syarat. Untuk event PGA, situs resmi PGA akan digunakan sebagai referensi dalam penyelesaian taruhan. Tidak ada situs lain yang akan dipertimbangkan. Untuk event DP World Tour, situs resmi DP akan digunakan sebagai referensi dalam penyelesaian taruhan. Tidak ada situs lain yang akan dipertimbangkan. Semua ketentuan diatas hanya untuk ronde tunggal.\n(l) Taruhan "Fairways Hit" Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Pada taruhan 18 Hole Atas/Bawah jika ada pemain yang mengundurkan diri sebelum menyelesaikan taruhan hole ke-18, taruhan akan dibatalkan kecuali taruhan yang telah ditentukan tanpa syarat. Untuk event PGA, situs resmi PGA akan digunakan sebagai referensi dalam penyelesaian taruhan. Tidak ada situs lain yang akan dipertimbangkan. Untuk event DP World Tour, situs resmi DP akan digunakan sebagai referensi dalam penyelesaian taruhan. Tidak ada situs lain yang akan dipertimbangkan. Semua ketentuan diatas hanya untuk ronde tunggal.\n(m) Taruhan "Total Putts" Atas/Bawah: Jika salah satu pemain tidak melakukan tee off, taruhan pada pasar ini akan dibatalkan. Pada taruhan 18 Hole Atas/Bawah jika ada pemain yang mengundurkan diri sebelum menyelesaikan taruhan hole ke-18, taruhan akan dibatalkan kecuali taruhan yang telah ditentukan tanpa syarat. Untuk event PGA, situs resmi PGA akan digunakan sebagai referensi dalam penyelesaian taruhan. Tidak ada situs lain yang akan dipertimbangkan. Untuk event DP World Tour, situs resmi DP akan digunakan sebagai referensi dalam penyelesaian taruhan. Tidak ada situs lain yang akan dipertimbangkan. Semua ketentuan diatas hanya untuk ronde tunggal.\n(n) Taruhan Outright: Non-runner no-bet. Semua taruhan akan diselesaikan pada saat penyerahan piala. Hasil babak playoff diperhitungkan. Hasil situs resmi pada saat penyerahan piala digunakan untuk tujuan penyelesaian taruhan (diskualifikasi setelah waktu tersebut tidak dihitung). Seorang pemain dianggap telah bermain setelah melakukan tee off. Apabila pemain mengundurkan diri setelah melakukan tee off maka taruhan atas pemain tersebut akan dihitung kalah pada taruhan outright, grup, match, atau 18 hole. Apabila suatu turnamen dikurangi dari jumlah hole yang dijadwalkan karena alasan apa pun (misalnya kondisi cuaca buruk), taruhan outright yang dipasang sebelum ronde final selesai akan diselesaikan pada saat penyerahan piala jika 36 hole turnamen tersebut telah diselesaikan. Jika kurang dari 36 hole atau taruhan outright dipasang setelah ronde final selesai maka taruhan akan dinyatakan tidak berlaku. Turnamen Top 5/Top 10/Top 20: Peraturan Dead-heat berlaku.\n\n24.8 Sistem Skoring: Tipe Skoring B berlaku` },
      { id: 's25', category: 'OLAHRAGA TERTENTU', title: 'GIMNASTIK', content: `25.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Gimnastik:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat satu kompetitor yang tidak ambil bagian dalam perlombaan tersebut, taruhan Head to Head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's26', category: 'OLAHRAGA TERTENTU', title: 'BOLA TANGAN', content: `26.1 Semua taruhan akan diselesaikan berdasarkan skor setelah waktu reguler 60 menit berakhir (Babak Tambahan dan Penalti tidak dihitung), kecuali dinyatakan berbeda. Jika waktu 60 menit yang dijadwalkan tidak dimainkan maka taruhan akan dinyatakan Tidak Berlaku, kecuali prop pertandingan di mana hasil telah dapat ditentukan.\n\n26.2 Setiap Babak Tambahan tidak akan diperhitungankan ke pasaran yang berkaitan dengan "Babak Kedua". Secara khusus, jika Mercy Rule diberlakukan dalam suatu pertandingan, semua taruhan akan dinyatakan berlaku sesuai skor pada saat itu.\n\n26.3 Jika terjadi pergantian arena pertandingan maka taruhan akan tetap berlaku selama Tim Tuan Rumah masih ditetapkan menjadi tuan rumah. Jika posisi Tim Tuan Rumah dan Tamu dalam suatu pertandingan dicantumkan terbalik, maka taruhan akan dinyatakan Tidak Berlaku.\n\n26.4 Jika suatu pertandingan ditunda atau dibatalkan dan tidak dilanjutkan kembali dalam kurun waktu 24 jam dari waktu mulai yang dijadwalkan, semua taruhan akan dinyatakan Tidak Berlaku dan modal taruhan akan dikembalikan.\n\n26.5 Berikut adalah jenis taruhan Tidak Langsung (Non Live) dan Taruhan Berjalan ("Live") yang ditawarkan pada Bola Tangan:\n(a) Suatu pertandingan harus selesai sepenuhnya agar taruhan dinyatakan berlaku (kecuali jika hasil dari pasaran tertentu telah dapat ditentukan). Semua pasaran Taruhan Berjalan tidak menghitung Babak Tambahan (jika ada), kecuali: (i) To Qualify (ii) To Lift Trophy (iii) To Win Match (termasuk OT/SO) (A) Jika hasil pertandingan ditentukan saat waktu reguler, maka pasaran ini akan dihitung berdasarkan hasil pada saat itu.\n(b) Untuk Taruhan Berjalan Paruh Babak, termasuk pasaran berikut, periode paruh babak yang ditentukan harus selesai agar taruhan dinyatakan berlaku (kecuali jika hasil dari pasaran tertentu telah dapat ditentukan). Semua Taruhan Berjalan Paruh Babak tidak menghitung Babak Tambahan (jika ada): (i) Handicap (ii) Total Gol (iii) Draw No Bet (iv) Kesempatan Ganda (v) First Goal of Half (vi) Margin of Victory (vii) Race to Markets (viii) Result(s) (ix) Team Totals (x) Total Ganjil/Genap\n(c) Untuk Taruhan Berjalan 10 menit, termasuk pasaran berikut, periode 10 menit yang ditentukan harus selesai agar taruhan dinyatakan berlaku (kecuali jika hasil dari taruhan tertentu telah dapat ditentukan): (i) Handicap (ii) Total Gol (iii) Last Goal (iv) Margin of Victory (v) Race to Markets (vi) Result(s) (vii) Team Totals (viii) Total Ganjil/Genap\n(d) Prop Pertandingan: Semua prop pertandingan, termasuk pasaran berikut, akan dihitung berdasarkan waktu reguler saja dan tidak termasuk Babak Tambahan (jika ada): (i) Team with Highest Scoring Half (ii) Highest Scoring Half (iii) Game Total Ganjil-Genap (iv) Team Total Ganjil-Genap (v) Margin Kemenangan (termasuk Alternatif) (vi) Double Result (termasuk Alternatif) (vii) Race to Markets (viii) Team to score X Goals (ix) Kedua Tim mencetak X Goals (x) Either Team to score X Goals\n(e) Taruhan Paruh Babak: (i) Periode babak yang ditentukan harus selesai agar taruhan dinyatakan berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. Tidak termasuk Babak Tambahan (jika ada).\n(f) Outright\n(g) Tipe Skoring B berlaku` },
      { id: 's27', category: 'OLAHRAGA TERTENTU', title: 'HURLING', content: `27.1 Kecuali jika tidak dinyatakan pada pasaran tertentu, semua taruhan akan diselesaikan berdasarkan waktu bermain yang regular 60 atau 70 menit (termasuk tambahan waktu yang diberikan oleh wasit) tidak termasuk babak tambahan atau adu penalti.\n\n27.2 Total poin yang dicetak oleh masing-masing tim akan digunakan untuk menentukan apakah taruhan tersebut adalah pemenang pada akhir pertandingan. Total skor yang diberikan kepada suatu tim adalah total poin dari gol dan poin yang dicetak. 1 goal adalah sama dengan 3 poin.\n\n27.3 Berikut adalah taruhan-taruhan yang ditawarkan pada Hurling:\n(a) Taruhan Non Live: (i) 1X2 (ii) Handicap Asia (iii) Babak 1/Babak Penuh (iv) Highest Scoring Half (A) Taruhan pada Highest Scoring Half adalah ditentukan oleh total skor yang diakumulasikan selama Babak Pertama terhadap total skor yang diakumulasikan selama Babak Kedua pada pertandingan yang ditawarkan untuk taruhan. Gol atau poin yang dicetak pada babak tambahan dikecualikan dalam penentuan pemenang. (v) Ganjil/Genap (vi) Outright (vii) Atas/Bawah (viii) Period Betting (ix) Total Gol (A) Taruhan Total Gol melibatkan prediksi total jumlah gol yang dicetak pada suatu pertandingan di mana taruhan tersebut ditempatkan. Gol yang dicetak pada babak tambahan akan dikecualikan.` },
      { id: 's28', category: 'OLAHRAGA TERTENTU', title: 'HOKI ES', content: `28.1 Semua pertandingan harus dimulai pada tanggal yang dijadwalkan (waktu lokal) agar taruhan dinyatakan berlaku. Jika arena pertandingan berubah, semua taruhan akan tetap berlaku selama Tim Tuan Rumah masih ditetapkan sebagai tuan rumah. Jika pertandingan berlangsung di arena pertandingan Tim Tamu, taruhan akan tetap berlaku selama Tim Tuan Rumah masih secara resmi ditetapkan sebagai tuan rumah, jika tidak, taruhan akan dinyatakan Tidak Berlaku. Untuk e-HOKI ES, lokasi "Tuan Rumah" dan "Tamu" yang ditunjukkan pada halaman Situs bersifat sebagai referensi.\n\n28.2 Penyelesaian taruhan akan dilakukan berdasarkan skor pada akhir pertandingan, termasuk Babak Tambahan dan Penalti, kecuali dinyatakan berbeda. Jika terjadi ADU PENALTI, hanya satu (1) gol yang akan ditambahkan ke skor pemenang untuk menentukan skor final pertandingan.\n\n28.3 Dalam Pasaran 2 Arah, peraturan taruhan Imbang, atau Seri akan berlaku. Modal pada taruhan tunggal dikembalikan, dan pada taruhan berganda/parlay, pilihan dinyatakan Tidak Berlaku.\n\n28.4 Pasaran 3 arah diselesaikan berdasarkan skor pada akhir waktu reguler, kecuali pasaran Kapan Pertandingan Berakhir (When Will Game End) yang merupakan jenis pasaran 3 Arah yang termasuk Babak Tambahan/Penalti.\n\n28.5 Untuk IIHF World Championships dan Pertandingan Olimpiade: Semua penyelesaian taruhan pertandingan akan ditentukan berdasarkan Peringkat Final Resmi pada akhir turnamen. Jika terdapat dua atau lebih tim yang berada di peringkat yang sama, taruhan akan dinyatakan Tidak Berlaku.\n\n28.6 Berikut adalah jenis taruhan Tidak Langsung (Non Live) dan Taruhan Berjalan ("Live") yang ditawarkan pada Hoki Es:\n(a) Penyelesaian pasaran berikut tidak termasuk Babak Tambahan/Penalti: (i) Handicap (ii) Asian Goal Line (iii) Kesempatan Ganda (3 Arah) (iv) Draw no Bet (v) Game Total (3 Arah) (vi) Highest Scoring Period (A) Jika terdapat 2 atau lebih periode yang memiliki skor sama, taruhan Tie akan dinyatakan sebagai pemenang. (B) Taruhan Periode – Periode yang ditentukan harus selesai agar taruhan dinyatakan berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. (vii) Money Line (3 Arah) (viii) Next Goal Scored (ix) Ganjil/Genap (A) Team Total Ganjil atau Genap – Jika tim yang dipasang tidak mencetak gol, taruhan akan dihitung dengan hasil Genap. (B) Game Total Ganjil atau Genap – Jika tidak ada skor, semua taruhan akan dihitung diselesaikan dengan hasil Genap. (x) Period Betting (A) Periode yang ditentukan harus selesai agar taruhan dinyatakan berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. (xi) Puck Line (3 Arah) (xii) Race to Markets (xiii) Team Total (3 Arah) (xiv) Team to Score First/Last (xv) Total/Team Goals Exactly (xvi) Total / Home and Away Goals Scored (xvii) To Score Last in Regulation (xviii) Who Will Win Most Periods (xix) Taruhan Berjalan 10 menit (A) Durasi 10 menit yang ditentukan misalnya: menit 31-40 harus selesai agar taruhan dinyatakan berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. Untuk tujuan penyelesaian taruhan, menit 51-60 tidak termasuk Babak Tambahan (jika ada). (xx) Semua taruhan pada pertandingan Klub Persahabatan (Hanya Waktu Reguler) dan Persahabatan Internasional (Hanya Waktu Reguler) akan diselesaikan berdasarkan skor pada akhir waktu reguler dan tidak termasuk Babak Tambahan (jika ada), kecuali dinyatakan berbeda dibawah ini. Penyelesaian pasaran berikut tidak termasuk Babak Tambahan/Penalti: (A) To Win Match (including overtime/shootout) (B) To Lift Trophy (C) To Qualify (D) When Will Game End (E) Penalty Shootout Winner (F) Penalty Shootout Correct Score (G) Top Tournament/Team Goalscorer – Pemain yang mencetak gol terbanyak selama kompetisi akan dianggap sebagai pemenang. All-in, bermain atau tidak. Peraturan Dead heat berlaku. (H) To Qualify From Group – Tim yang masuk dari Babak Penyisihan ke Babak Kualifikasi akan dianggap sebagai pemenang. (xxi) Pasaran Goalscorer (First/Last/Any) (A) Untuk memprediksi pemain yang mencetak gol pertama/terakhir atau kapan saja selama pertandingan. (xxii) Dalam pasaran Game Number of Suspension (A) Untuk menghitung berapa kali penangguhan 2 menit diberikan selama periode pertandingan tertentu. Setiap penangguhan 2 menit akan dihitung 1. (B) Double Minor Penalti (double minor) (2+2 menit) dihitung sebagai 2 penangguhan yang masing-masing berlangsung 2 menit. (C) Semua penalti yang diberikan sebelum dimulainya suatu periode akan dihitung ke periode sebelumnya. Periode yang diberikan pada akhir pertandingan juga termasuk ke dalam periode sebelumnya (periode ke 3 atau Babak Tambahan). (D) Penangguhan yang tertunda dan tidak dijalankan karena terjadi gol, tidak akan dihitung, meskipun tercatat atau tidak tercatat dalam data resmi pertandingan. (xxiii) Players Statistics (A) Tanpa mempertimbangkan negara dan turnamen, semua taruhan pada Players Statistic akan dihitung berdasarkan hasil pertandingan waktu reguler, tidak termasuk hasil Babak Tambahan dan Adu Penalti. (B) Jika pemain tidak berpartisipasi dalam pertandingan, taruhan pada pemain tersebut akan dinyatakan Tidak Berlaku/Dikembalikan. (xxiv) NHL Regular Season Points/Match-Ups/Wins (A) Tim harus menyelesaikan setidaknya 80 pertandingan musim reguler agar taruhan dinyatakan berlaku, kecuali jika hasil dari pasaran tertentu telah dapat ditentukan. (xxv) Outright/Conference/Divisional Betting (A) Semua taruhan akan tetap berlaku meski terjadi relokasi, perubahan nama tim, atau durasi musim. (xxvi) Series Betting (A) Taruhan akan dinyatakan Tidak Berlaku apabila jumlah pertandingan yang sah (sesuai masing-masing organisasi penyelenggara) tidak selesai atau diubah.\n(b) Sistem skoring: Tipe Skoring B berlaku.\n\n28.7 Taruhan e-HOKI ES: (a) Kecuali jika dinyatakan pada Peraturan 29.7, maka Peraturan 29 yang akan berlaku pada taruhan e-HOKI ES. (b) e-HOKI ES adalah pertandingan yang disimulasi berdasarkan Kecerdasaran Buatan (Artificial Intelligence), Pembelajaran Mesin (Machine Learning) dan riwayat database hoki es untuk mencerminkan bentuk tim dan permainan pertandingan. (c) Hasil pertandingan e-HOKI ES, skor dan data penentu taruhan lainnya dihasilkan oleh perangkat lunak dan tidak tersedia sumber lain, termasuk dari tim resmi atau situs liga pertandingan. (d) e-HOKI ES adalah pertandingan yang disiarkan dan termasuk pertandingan Taruhan Umum, para Pengguna Akhir dapat bertaruh pada pertandingan tertentu. Hasil pada pertandingan tersebut akan menentukan perhitungan dari taruhan yang ditempatkan oleh semua Pengguna Akhir. (e) Apabila suatu pertandingan tidak selesai dalam waktu yang dijadwalkan karena kesalahan teknis apapun, termasuk bukan hanya kesalahan komputer, elektronik, perangkat lunak, perangkat keras ataupun koneksi, pertandingan akan diselesaikan dengan status pertandingan tidak selesai dimainkan. Dalam hal ini taruhan yang diselesaikan hanya taruhan yang telah ditentukan tanpa syarat. Untuk pasar lainnya dan terlepas dari hasil indikatif apa pun, taruhan akan dinyatakan tidak berlaku dan modal taruhan akan dikembalikan ke Pengguna Akhir. Operator akan menyelesaikan pertandingan tersebut sesuai dengan aturan ini dan keputusan Operator akan dianggap final. (f) Operator berhak menyatakan sebuah taruhan e-HOKI ES tidak berlaku apabila; (i) sebagian atau perincian taruhan yang tidak tepat; (ii) Pengguna Akhir dicurigai berpartisipasi dalam penipuan, kolusi, pencucian uang atau kegiatan ilegal lainnya; (iii) pertandingan tidak dimainkan atau tidak selesai atau hasil pertandingan tidak dapat ditentukan; (iv) penerimaan taruhan akan melampaui batas maksimum bertaruh; (v) jumlah kredit taruhan tidak tersedia di akun pemain; (vi) terjadi kesalahan (manusia atau lainnya) atau kegagalan sistem yang mengakibatkan odds yang ditawarkan tidak tepat; (vii) kesalahan teknis seperti kegagalan komunikasi, kecacatan, gangguan, keterlambatan, virus, penolakan layanan, atau data rusak; atau (viii) jika terjadi kesalahan teknis yang menghasilkan pembayaran yang tidak wajar. (g) Apabila terjadi kesalahan (manusia atau lainnya) atau kegagalan sistem saat perhitungan taruhan, penyelesaian akan dianggap tidak valid dan diperbaiki sebagaimana mestinya. Apabila Pengguna Akhir tidak memiliki kredit yang mencukupi di dalam akun, maka dalam kondisi ini, Pengguna Akhir akan diminta untuk mengembalikan jumlah dana yang diperlukan kepada Operator.` },
      { id: 's29', category: 'OLAHRAGA TERTENTU', title: 'JUDO', content: `29.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Judo:\n(a) Taruhan Non Live: (i) Head to Head (A) Kedua kompetitor yang dipasangkan harus memulai dan menyelesaikan permainan agar taruhan tetap berlaku. (B) Jika terdapat salah satu kompetitor tidak ikut serta dalam perlombaan tersebut, taruhan head to head dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
      { id: 's30', category: 'OLAHRAGA TERTENTU', title: 'SENI BELA DIRI CAMPURAN', content: `30.1 Untuk tujuan taruhan, petarung yang diskualifikasi pada saat pertandingan berlangsung akan dihitung sebagai knockout oleh lawannya.\n\n30.2 Jika seorang petarung gagal menjawab bel untuk memulai suatu ronde, atau didiskualifikasi di antara ronde, maka lawannya akan dianggap telah memenangkan ronde sebelumnya.\n\n30.3 Berikut adalah taruhan-taruhan yang ditawarkan pada Seni Bela Diri Campuran:\n(a) Taruhan Non Live: (i) Handicap Asia (ii) Ganjil/Genap (A) Taruhan Ganjil/Genap berhubungan dengan ronde di mana pemenang diumumkan dalam pertandingan (apakah itu ronde dengan angka ganjil atau genap). (iii) Atas/Bawah (A) Taruhan Atas/Bawah berhubungan dengan ronde di mana pemenang diumumkan dalam pertandingan (menghasilkan ronde di atas atau di bawah dari jumlah target yang ditetapkan oleh Operator) untuk pertandingan tersebut.` },
      { id: 's31', category: 'OLAHRAGA TERTENTU', title: 'OLAHRAGA PANCALOMBA MODERN', content: `31.1 Berikut adalah taruhan-taruhan yang ditawarkan pada Olahraga Pancalomba Modern:\n(a) Taruhan Non Live: (i) Head to Head (A) Taruhan mengacu pada kompetitor yang dipasangkan dengan posisi akhir terbaik dalam perlombaan. (B) Jika terdapat setidaknya satu kompetitor tidak ambil bagian dalam perlombaan tersebut maka taruhan Head to Head akan dinyatakan tidak berlaku dan taruhan akan dikembalikan. (ii) Outright` },
